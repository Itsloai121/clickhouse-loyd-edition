  - id: python-subprocess-shell-true
    languages: [python]
    severity: WARNING
    message: "subprocess call with shell=True can enable OS command injection if arguments contain untrusted data. Prefer an argument list with shell=False."
    metadata:
      category: security
      checklist: "B. Input validation and injection"
      checklist_ids: [INJ-03, OS-04]
      confidence: MEDIUM
    pattern-either:
