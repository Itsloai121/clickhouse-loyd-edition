      - pattern: AES_set_decrypt_key(<... "..." ...>, ...)
      - pattern: EVP_EncryptInit_ex($C, $E, $ENG, <... "..." ...>, $IV)
      - pattern: EVP_DecryptInit_ex($C, $E, $ENG, <... "..." ...>, $IV)
      - pattern: EVP_CipherInit_ex($C, $E, $ENG, <... "..." ...>, $IV, $ENC)
      - pattern: EVP_EncryptInit_ex($C, $E, $ENG, $K, <... "..." ...>)
      - pattern: EVP_DecryptInit_ex($C, $E, $ENG, $K, <... "..." ...>)
      - pattern: EVP_CipherInit_ex($C, $E, $ENG, $K, <... "..." ...>, $ENC)
      - pattern: HMAC($EVP, <... "..." ...>, ...)
      - pattern: HMAC_Init_ex($C, <... "..." ...>, ...)
  - id: c-hardcoded-credentials
    languages: [c, cpp]
    severity: ERROR
    message: >-
      Credential-like variable initialised with a string literal. Load secrets from a secret
      manager or protected configuration, never from source code.
