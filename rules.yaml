  # ---------------------------------------------------------------------------
  # 5a. Use-after-free
  #     Raw free()/delete followed by a dereference/use of the same pointer in
  #     the same block, unless the pointer is re-assigned in between.
  # ---------------------------------------------------------------------------
  - id: c-use-after-free
    languages: [c, cpp]
    severity: ERROR
    message: >-
      Pointer '$P' is used after being freed/deleted. Set it to nullptr immediately after
      freeing and prefer RAII (std::unique_ptr, std::vector, Arena) over raw free/delete.
    metadata:
      category: memory
      cwe: ["CWE-416: Use After Free"]
      checklist: "H. Memory safety and language-specific weaknesses"
      checklist_ids: [MEM-02]
      confidence: MEDIUM
      technology: [c, cpp]
    paths:
      exclude:
        - "**/contrib/**"
        - "**/tests/**"
        - "**/benchmarks/**"
        - "**/gtest_*"
        - "**/build/**"
        - "**/build_*/**"
    patterns:
      - pattern-inside: |
          $FREE($P);
          ...
      - metavariable-regex:
          metavariable: $FREE
          regex: '^((::)?std::|::)?(free|cfree)$'
      - pattern-either:
          - pattern: $P[...]
          - pattern: '*$P'
          - pattern: memcpy($P, ...)
          - pattern: memcpy($X, $P, ...)
          - pattern: memset($P, ...)
          - pattern: memmove($P, ...)
          - pattern: strlen($P)
          - pattern: strcpy($P, ...)
          - pattern: strcpy($X, $P)
          - pattern: printf(..., $P, ...)
      - pattern-not-inside: |
          $FREE($P);
          ...
          $P = nullptr;
          ...
      - pattern-not-inside: |
          $FREE($P);
          ...
          $P = NULL;
          ...
      - pattern-not-inside: |
          $FREE($P);
          ...
          $P = 0;
          ...
      - pattern-not-inside: |
          $FREE($P);
          ...
          $P = <... malloc(...) ...>;
          ...
      - pattern-not-inside: |
          $FREE($P);
          ...
          $P = <... calloc(...) ...>;
          ...
      - pattern-not-inside: |
          $FREE($P);
          ...
          $P = <... realloc(...) ...>;
          ...
      - pattern-not-inside: |
          $FREE($P);
          ...
          $P = $G(...);
          ...
      - pattern-not-inside: |
          $FREE($P);
          ...
          $P = &$Y;
          ...
