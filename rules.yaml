    severity: WARNING
    message: "Potential security weakness detected by a pattern heuristic. Verify reachability, attacker control, sanitization, and runtime configuration before triage."
    metadata:
      category: "security"
      cwe: ["CWE-250"]
      checklist: "Polyglot SAST master prompt - language-specific vulnerability matrix"
      checklist_ids: [DB-04]
      confidence: MEDIUM
      technology: [sql]
    paths:
      exclude:
        - "**/tests/**"
        - "**/test/**"
        - "**/*_test.go"
        - "**/fixtures/**"
        - "**/vendor/**"
    pattern-regex: '(?is)\bCREATE\s+(?:OR\s+REPLACE\s+)?FUNCTION\b.{0,500}?\bSECURITY\s+DEFINER\b'
    # Review note: security definer is a candidate signal, not proof.
    # Confirm data origin, trust boundary, execution context, and guard behavior.
    # Prefer framework-native safe APIs and allowlists over ad-hoc sanitization.
    # Suppress only with a documented rationale and a regression test.
  - id: polyglot-sql-password-storage
    languages: [generic]
    severity: WARNING
    message: "Potential security weakness detected by a pattern heuristic. Verify reachability, attacker control, sanitization, and runtime configuration before triage."
    metadata:
      category: "security"
      cwe: ["CWE-916"]
      checklist: "Polyglot SAST master prompt - language-specific vulnerability matrix"
      checklist_ids: [AUTH-05]
      confidence: MEDIUM
      technology: [sql]
    paths:
      exclude:
        - "**/tests/**"
        - "**/test/**"
        - "**/*_test.go"
        - "**/fixtures/**"
        - "**/vendor/**"
    pattern-regex: '(?i)\b(?:password\s*=\s*md5\s*\([^)]*\)|SELECT\s+md5\s*\([^)]*\))'
    # Review note: password storage is a candidate signal, not proof.
    # Confirm data origin, trust boundary, execution context, and guard behavior.
    # Prefer framework-native safe APIs and allowlists over ad-hoc sanitization.
    # Suppress only with a documented rationale and a regression test.
  # AUDIT CATALOG 0001: RECONNAISSANCE
  # Objective: Map entry points, trust boundaries, and sensitive sinks before scanning.
  # Evidence checklist:
  # - Identify the source location and whether an attacker can influence the value.
  # - Record intermediate transformations, validation, encoding, and sanitization.
  # - Identify the final sink and the privileges of the executing process.
  # - Verify the guard dominates the sink on every relevant control-flow path.
  # - Check error paths, exception paths, retries, and asynchronous callbacks.
  # - Determine whether the behavior is reachable in production configuration.
  # - Distinguish a confirmed flaw from a suspicious pattern or missing evidence.
  # - Attach a minimal reproducer or test case where safe and practical.
  # - Map the finding to a CWE and a relevant OWASP / SEI CERT category.
  # - Recommend a fix that preserves intended behavior and reduces attack surface.
  # - Add regression coverage for the original failure mode.
  # - Re-run the rule after remediation and record any remaining limitations.
  # False-positive review:
  # - Check whether the value is a compile-time constant or an allowlisted enum.
  # - Check whether a safe wrapper guarantees validation for all callers.
  # - Check whether a framework performs context-appropriate encoding by default.
  # - Do not infer safety from variable names, comments, or a nearby unrelated check.
  # - Do not infer exploitability from a pattern match alone.
  # Severity guidance:
  # - CRITICAL: reliable remote compromise or equivalent broad impact in context.
  # - HIGH: material confidentiality, integrity, or privilege impact with plausible reachability.
  # - MEDIUM: constrained impact, meaningful prerequisites, or limited exposure.
  # - LOW: defense-in-depth issue or low-impact weakness with contextual evidence.
  # - INFO: advisory signal that requires manual confirmation.
  # Coverage note: static patterns cannot prove the absence of vulnerabilities.
  # Coverage note: dynamic dispatch, reflection, macros, generated code, and native extensions
  # may hide source-to-sink paths from a lightweight scanner.
  # Coverage note: cross-function and cross-file flows depend on the analyzer edition and config.
  # Coverage note: keep exclusions narrow and report every excluded path in the audit record.
  # Coverage note: a clean scan is not a security certification or a release approval.
  # Operational note: pin the scanner version and archive the exact command and rule hash.
  # Operational note: run a representative fixture suite before enabling blocking CI gates.
  # Operational note: triage newly introduced findings separately from accepted legacy debt.
  # Operational note: protect SARIF/JSON reports because paths and snippets may be sensitive.
  # Operational note: apply timeouts and target-size limits to keep CI predictable.
  # Remediation note: prefer safe APIs and explicit trust boundaries over regex-only filtering.
