        - "**/build/**"
        - "**/build_*/**"
    patterns:
      - pattern-either:
          - pattern: system($CMD)
          - pattern: std::system($CMD)
          - pattern: popen($CMD, ...)
          - pattern: execl("/bin/sh", ..., "-c", $CMD, ...)
          - pattern: execlp("sh", ..., "-c", $CMD, ...)
