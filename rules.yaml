        - "**/benchmarks/**"
        - "**/gtest_*"
        - "**/build/**"
        - "**/build_*/**"
    patterns:
      - pattern: $LOG(..., $ARG, ...)
      - metavariable-regex:
          metavariable: $LOG
          regex: '^(LOG_[A-Z_]+|poco_[a-z]+|printf|std::printf|fprintf|syslog)$'
      - metavariable-regex:
          metavariable: $ARG
          regex: '(?i)^(?!\s*(L|u8)?")(?!.*\.(size|empty|length)\(\)\s*$)(?=.*(^|[^a-z0-9])(password|passwd|secret|private_?key|api_?key|access_?key|auth_?token|credentials?)([^a-z0-9]|$))'
  # ===========================================================================
  # I. Operating system, filesystem, and process execution  (OS-01/02/03/06)
  # ===========================================================================
  - id: c-insecure-temp-file
    languages: [c, cpp]
    severity: WARNING
    message: >-
      Predictable or race-prone temporary file. Use mkstemp()/mkdtemp()/std::filesystem with
      O_EXCL semantics instead of mktemp/tmpnam/tempnam or a fixed path under /tmp.
    metadata:
      category: filesystem
      cwe: ["CWE-377: Insecure Temporary File", "CWE-379: Creation of Temporary File in Directory with Insecure Permissions"]
      checklist: "I. Operating system, filesystem, and process execution"
      checklist_ids: [OS-06, OS-02]
      confidence: HIGH
      technology: [c, cpp]
    paths:
      exclude:
        - "**/contrib/**"
        - "**/tests/**"
        - "**/benchmarks/**"
        - "**/gtest_*"
        - "**/build/**"
        - "**/build_*/**"
    pattern-either:
      - pattern: mktemp(...)
      - pattern: tmpnam(...)
      - pattern: tempnam(...)
      - pattern: std::tmpnam(...)
      - patterns:
          - pattern-either:
              - pattern: fopen($P, ...)
              - pattern: creat($P, ...)
              - pattern: open($P, ...)
          - pattern-not: open($P, <... O_EXCL ...>, ...)
          - metavariable-regex:
              metavariable: $P
              regex: '^\s*"/(var/)?tmp/'
  - id: c-toctou-access-then-open
    languages: [c, cpp]
    severity: WARNING
    message: >-
      Time-of-check/time-of-use race: access() is used to decide whether to open the same path.
      An attacker can swap the file (e.g. via symlink) in between. Open first with O_NOFOLLOW and
      check the resulting descriptor (fstat), instead of checking the path.
    metadata:
      category: filesystem
      cwe: ["CWE-367: Time-of-check Time-of-use (TOCTOU) Race Condition"]
      checklist: "I. Operating system, filesystem, and process execution"
      checklist_ids: [OS-02, MEM-08]
      confidence: MEDIUM
      technology: [c, cpp]
    paths:
      exclude:
        - "**/contrib/**"
        - "**/tests/**"
        - "**/benchmarks/**"
        - "**/gtest_*"
        - "**/build/**"
        - "**/build_*/**"
    patterns:
      - pattern-either:
          - pattern-inside: |
              if (<... access($P, ...) ...>) { ... }
          - pattern-inside: |
              if (<... access($P, ...) ...>) { ...; return ...; }
              ...
          - pattern-inside: |
              if (<... access($P, ...) ...>) return ...;
              ...
      - pattern-either:
          - pattern: open($P, ...)
          - pattern: fopen($P, ...)
  - id: c-unchecked-privilege-drop
    languages: [c, cpp]
    severity: ERROR
    message: >-
      Return value of a privilege-changing call is ignored. If setuid/setgid/setgroups/chroot
      fails the process keeps elevated privileges. Check the result and abort on failure.
    metadata:
      category: privilege
      cwe: ["CWE-252: Unchecked Return Value", "CWE-273: Improper Check for Dropped Privileges"]
      checklist: "I. Operating system, filesystem, and process execution"
      checklist_ids: [OS-03]
      confidence: HIGH
      technology: [c, cpp]
    paths:
      exclude:
        - "**/contrib/**"
        - "**/tests/**"
        - "**/benchmarks/**"
        - "**/gtest_*"
        - "**/build/**"
        - "**/build_*/**"
    patterns:
      - pattern: $F(...);
      - pattern-not-inside: |
          $T $V = $F(...);
      - pattern-not-inside: |
          $V = $F(...);
      - metavariable-regex:
          metavariable: $F
          regex: '^(::)?(setuid|setgid|seteuid|setegid|setreuid|setregid|setresuid|setresgid|setgroups|initgroups|chroot)$'
  - id: c-world-writable-permissions
    languages: [c, cpp]
    severity: WARNING
    message: >-
      World-writable permissions or umask(0). Grant the minimum mode needed (e.g. 0600/0640/0750).
    metadata:
      category: filesystem
      cwe: ["CWE-732: Incorrect Permission Assignment for Critical Resource"]
      checklist: "I. Operating system, filesystem, and process execution"
      checklist_ids: [OS-01, CFG-04]
      confidence: MEDIUM
      technology: [c, cpp]
    paths:
      exclude:
        - "**/contrib/**"
        - "**/tests/**"
        - "**/benchmarks/**"
        - "**/gtest_*"
        - "**/build/**"
        - "**/build_*/**"
    pattern-either:
      - pattern: umask(0)
      - patterns:
          - pattern-either:
              - pattern: fs::permissions($P, <... fs::perms::all ...>, ...)
              - pattern: fs::permissions($P, <... fs::perms::others_write ...>, ...)
              - pattern: std::filesystem::permissions($P, <... std::filesystem::perms::all ...>, ...)
              - pattern: std::filesystem::permissions($P, <... std::filesystem::perms::others_write ...>, ...)
          - pattern-not: fs::permissions($P, $M, fs::perm_options::remove)
          - pattern-not: std::filesystem::permissions($P, $M, std::filesystem::perm_options::remove)
      - patterns:
          - pattern: $F(..., $MODE)
          - metavariable-regex:
              metavariable: $F
              regex: '^(::)?(chmod|fchmod|mkdir|open|creat|mkfifo|mknod)$'
          - metavariable-regex:
              metavariable: $MODE
              regex: '^\s*0?(777|666|776|766|667|677)\s*$'
  # ===========================================================================
  # H. Memory safety - additional checks (MEM-01/03/05/08)
  # ===========================================================================
  - id: c-sizeof-pointer-parameter
    languages: [c, cpp]
    severity: ERROR
    message: >-
      sizeof applied to a pointer/array function parameter yields the pointer size (4/8), not the
      buffer size, so the bound is wrong (truncated copy or overflow). Pass the buffer length
      explicitly or use std::span / a reference-to-array.
    metadata:
      category: memory
      cwe: ["CWE-467: Use of sizeof() on a Pointer Type", "CWE-131: Incorrect Calculation of Buffer Size"]
      checklist: "H. Memory safety and language-specific weaknesses"
      checklist_ids: [MEM-01]
      confidence: HIGH
      technology: [c, cpp]
    paths:
      exclude:
        - "**/contrib/**"
        - "**/tests/**"
        - "**/benchmarks/**"
        - "**/gtest_*"
        - "**/build/**"
        - "**/build_*/**"
    patterns:
      - pattern-either:
          - pattern-inside: |
              $RET $FUNC(..., $T *$P, ...) { ... }
          - pattern-inside: |
              $RET $FUNC(..., $T $P[], ...) { ... }
      - pattern-either:
          - pattern: memset($P, $V, sizeof($P))
          - pattern: memcpy($P, $S, sizeof($P))
          - pattern: memcpy($D, $P, sizeof($P))
          - pattern: memmove($P, $S, sizeof($P))
          - pattern: strncpy($P, $S, sizeof($P))
          - pattern: strncat($P, $S, sizeof($P))
          - pattern: snprintf($P, sizeof($P), ...)
          - pattern: fgets($P, sizeof($P), $F)
          - pattern: read($FD, $P, sizeof($P))
          - pattern: recv($FD, $P, sizeof($P), ...)
  - id: c-length-narrowing-cast
    languages: [c, cpp]
    severity: WARNING
    message: >-
      Length/count argument is cast to a narrower or signed integer type before a memory/IO call.
      Truncation or sign extension can turn a huge size into a small/negative one and bypass bounds
      checks. Keep size_t end-to-end and validate before narrowing.
    metadata:
      category: memory
      cwe: ["CWE-197: Numeric Truncation Error", "CWE-195: Signed to Unsigned Conversion Error", "CWE-681: Incorrect Conversion between Numeric Types"]
      checklist: "H. Memory safety and language-specific weaknesses"
      checklist_ids: [MEM-05]
      confidence: MEDIUM
      technology: [c, cpp]
    paths:
      exclude:
        - "**/contrib/**"
        - "**/tests/**"
        - "**/benchmarks/**"
        - "**/gtest_*"
        - "**/build/**"
        - "**/build_*/**"
    patterns:
      - pattern-either:
          - pattern: $F($A, $B, ($T)$X, ...)
          - pattern: $F($A, $B, static_cast<$T>($X), ...)
      - metavariable-regex:
          metavariable: $F
          regex: '^(std::)?(memcpy|memmove|memset|strncpy|strncat|read|write|recv|send|fread|fwrite)$'
      - metavariable-regex:
          metavariable: $T
          regex: '^(int|int32_t|short|int16_t|uint16_t|unsigned short|uint8_t|int8_t|signed|signed int|uint32_t|unsigned|unsigned int)$'
      - metavariable-regex:
          metavariable: $X
          regex: '^(?!\s*sizeof\b)'
  - id: c-unchecked-malloc-null-deref
    languages: [c, cpp]
    severity: WARNING
    message: >-
      Result of malloc/calloc is used without a NULL check. On allocation failure this is a NULL
      dereference (or an attacker-influenced write near address 0). Check the pointer, or use
      std::vector / new (which throws).
    metadata:
      category: memory
      cwe: ["CWE-476: NULL Pointer Dereference", "CWE-690: Unchecked Return Value to NULL Pointer Dereference"]
      checklist: "H. Memory safety and language-specific weaknesses"
      checklist_ids: [MEM-03]
      confidence: MEDIUM
      technology: [c, cpp]
    paths:
      exclude:
        - "**/contrib/**"
        - "**/tests/**"
        - "**/benchmarks/**"
        - "**/gtest_*"
        - "**/build/**"
        - "**/build_*/**"
    patterns:
      - pattern-either:
          - pattern-inside: |
              $P = <... malloc(...) ...>;
              ...
          - pattern-inside: |
              $P = <... calloc(...) ...>;
              ...
          - pattern-inside: |
              $T *$P = <... malloc(...) ...>;
              ...
          - pattern-inside: |
              $T *$P = <... calloc(...) ...>;
              ...
      - pattern-either:
          - pattern: $P[...]
          - pattern: '*$P'
          - pattern: memcpy($P, ...)
          - pattern: memset($P, ...)
          - pattern: strcpy($P, ...)
      - pattern-not-inside: |
          if (<... $P ...>) { ... }
          ...
      - pattern-not-inside: |
          assert(<... $P ...>);
          ...
  - id: c-non-reentrant-libc-function
    languages: [c, cpp]
    severity: WARNING
    message: >-
      Non-reentrant libc function that returns a pointer to static storage. In multi-threaded code
      this is a data race (corrupted or leaked data). Use the _r variant (strtok_r, localtime_r,
      gmtime_r, strerror_r, getpwnam_r, ...).
    metadata:
      category: memory
      cwe: ["CWE-362: Race Condition", "CWE-479: Signal Handler Use of a Non-reentrant Function", "CWE-676: Dangerous Function"]
      checklist: "H. Memory safety and language-specific weaknesses"
      checklist_ids: [MEM-08]
      confidence: HIGH
      technology: [c, cpp]
    paths:
      exclude:
        - "**/contrib/**"
        - "**/tests/**"
        - "**/benchmarks/**"
        - "**/gtest_*"
        - "**/build/**"
        - "**/build_*/**"
    patterns:
      - pattern: $F(...)
      - metavariable-regex:
          metavariable: $F
          regex: '^(::|std::)?(strtok|localtime|gmtime|ctime|asctime|strerror|strsignal|gethostbyname|gethostbyaddr|getservbyname|getservbyport|inet_ntoa|getpwnam|getpwuid|getgrnam|getgrgid|getlogin)$'
  - id: cpp-fmt-runtime-nonliteral
    languages: [cpp]
    severity: WARNING
    message: >-
      fmt::runtime() with a non-literal format string. fmt is type-safe (no memory corruption), but any
      '{' or '}' in the data raises fmt::format_error, losing the log line or aborting the operation
      (denial of service / log injection when the data is attacker-influenced). Log data as an
      argument instead: LOG_X(log, "{}", data).
    metadata:
      category: logging
      cwe: ["CWE-134: Use of Externally-Controlled Format String", "CWE-117: Improper Output Neutralization for Logs"]
      checklist: "M. Error handling, logging, and monitoring"
      checklist_ids: [LOG-04, MEM-07, BUS-06]
      confidence: MEDIUM
      technology: [cpp]
    paths:
      exclude:
        - "**/contrib/**"
        - "**/tests/**"
        - "**/benchmarks/**"
        - "**/gtest_*"
        - "**/build/**"
        - "**/build_*/**"
    patterns:
      - pattern: fmt::runtime($FMT)
      - metavariable-regex:
          metavariable: $FMT
          regex: '^(?!\s*((L|u8|u|U)?"|_\(|N_\())'
  - id: cpp-std-regex-dos
    languages: [cpp]
    severity: INFO
    message: >-
      std::regex is slow (exponential backtracking on crafted input) and recurses deeply, which can
      overflow the stack on long inputs. Do not run it on untrusted data; use RE2 or a hand-written
      parser, and cap input length.
    metadata:
      category: availability
      cwe: ["CWE-1333: Inefficient Regular Expression Complexity", "CWE-674: Uncontrolled Recursion"]
      checklist: "L. Business logic, abuse, and availability"
      checklist_ids: [BUS-06]
      confidence: LOW
      technology: [cpp]
    paths:
      exclude:
        - "**/contrib/**"
        - "**/tests/**"
        - "**/benchmarks/**"
