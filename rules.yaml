      - pattern: SSL_set_verify($S, SSL_VERIFY_NONE, ...)
      - pattern: curl_easy_setopt($H, CURLOPT_SSL_VERIFYPEER, 0L)
      - pattern: curl_easy_setopt($H, CURLOPT_SSL_VERIFYPEER, 0)
      - pattern: curl_easy_setopt($H, CURLOPT_SSL_VERIFYHOST, 0L)
      - pattern: curl_easy_setopt($H, CURLOPT_SSL_VERIFYHOST, 0)
      - pattern: Poco::Net::Context::VERIFY_NONE
      - pattern: boost::asio::ssl::verify_none
      - pattern: asio::ssl::verify_none
  - id: c-insecure-random-for-security
    languages: [c, cpp]
    severity: WARNING
    message: >-
      Predictable PRNG (rand/random/drand48, or time-seeded srand) used where an unpredictable
      value is needed (token, key, nonce, salt, IV, session id). Use RAND_bytes, getrandom(2) or
      /dev/urandom.
    metadata:
      category: crypto
      cwe: ["CWE-338: Cryptographically Weak PRNG", "CWE-330: Insufficiently Random Values"]
      checklist: "E. Cryptography and sensitive information"
      checklist_ids: [CRY-06, AUTH-05, AUTH-03]
      confidence: MEDIUM
      technology: [c, cpp]
    paths:
