rules:
  - id: cpp-taint-untrusted-input-to-memory-copy
    mode: taint
    languages: [c, cpp]
    severity: ERROR
    message: "Untrusted input reaches a memory or string copy sink. Validate bounds, canonicalize lengths, and use bounded copy APIs."
    metadata:
      category: memory
      checklist: "11. Memory Safety"
      cwe:
        - "CWE-120: Buffer Copy without Checking Size of Input"
        - "CWE-787: Out-of-bounds Write"
        - "CWE-125: Out-of-bounds Read"
      confidence: HIGH
    options:
      symbolic_propagation: true
    pattern-sources: &untrusted_input_sources
      - pattern: getenv(...)
      - pattern: std::getenv(...)
      - pattern: argv[$I]

      - patterns:
          - pattern: recv($SOCK, $BUF, $LEN, $FLAGS)
          - focus-metavariable: $BUF
      - pattern: recv($SOCK, $BUF, $LEN, $FLAGS)

      - patterns:
          - pattern: recvfrom($SOCK, $BUF, $LEN, $FLAGS, $ADDR, $ADDRLEN)
          - focus-metavariable: $BUF
      - pattern: recvfrom($SOCK, $BUF, $LEN, $FLAGS, $ADDR, $ADDRLEN)

      - patterns:
          - pattern: recvmsg($SOCK, $MSG, $FLAGS)
          - focus-metavariable: $MSG
      - pattern: recvmsg($SOCK, $MSG, $FLAGS)

      - patterns:
          - pattern: read($FD, $BUF, $LEN)
          - focus-metavariable: $BUF
      - pattern: read($FD, $BUF, $LEN)

      - patterns:
          - pattern: pread($FD, $BUF, $LEN, $OFFSET)
          - focus-metavariable: $BUF
      - pattern: pread($FD, $BUF, $LEN, $OFFSET)

      - patterns:
          - pattern: readv($FD, $IOV, $IOVCNT)
          - focus-metavariable: $IOV
      - pattern: readv($FD, $IOV, $IOVCNT)

      - patterns:
          - pattern: fread($BUF, $SIZE, $COUNT, $STREAM)
          - focus-metavariable: $BUF
      - pattern: fread($BUF, $SIZE, $COUNT, $STREAM)

      - patterns:
          - pattern: fgets($BUF, $SIZE, $STREAM)
          - focus-metavariable: $BUF

      - patterns:
          - pattern: gets($BUF)
          - focus-metavariable: $BUF

      - patterns:
          - pattern: scanf("%s", $BUF)
          - focus-metavariable: $BUF

      - patterns:
          - pattern: fscanf($FILE, "%s", $BUF)
          - focus-metavariable: $BUF

      - patterns:
          - pattern: sscanf($SRC, "%s", $BUF)
          - focus-metavariable: $BUF

      - patterns:
          - pattern: std::getline($STREAM, $STR)
          - focus-metavariable: $STR

      - patterns:
          - pattern: getline($STREAM, $STR)
          - focus-metavariable: $STR

      - patterns:
          - pattern: std::cin >> $X
          - focus-metavariable: $X

      - patterns:
          - pattern: $STREAM >> $X
          - focus-metavariable: $X

      - patterns:
          - pattern: $STREAM.read($BUF, $LEN)
          - focus-metavariable: $BUF
      - pattern: $STREAM.read($BUF, $LEN)

      - patterns:
          - pattern: $STREAM.readsome($BUF, $LEN)
          - focus-metavariable: $BUF

      - patterns:
          - pattern: $STREAM.getline($BUF, $LEN)
          - focus-metavariable: $BUF

      - patterns:
          - pattern: $STREAM.get($BUF, $LEN)
          - focus-metavariable: $BUF

      - patterns:
          - pattern: $SOCK.recv($BUF, $LEN, ...)
          - focus-metavariable: $BUF

      - patterns:
          - pattern: $SOCK.receive($BUF, $LEN)
          - focus-metavariable: $BUF

      - patterns:
          - pattern: $CONN.read($BUF, $LEN)
          - focus-metavariable: $BUF

      - patterns:
          - pattern: $READER.read($BUF, $LEN)
          - focus-metavariable: $BUF

      - patterns:
          - pattern: readBinary($X)
          - focus-metavariable: $X

      - patterns:
          - pattern: readString($X)
          - focus-metavariable: $X

      - patterns:
          - pattern: readStringText($X)
          - focus-metavariable: $X

      - patterns:
          - pattern: readIntBinary($X)
          - focus-metavariable: $X

      - patterns:
          - pattern: readUIntBinary($X)
          - focus-metavariable: $X

      - patterns:
          - pattern: readVarUInt($X)
          - focus-metavariable: $X

      - patterns:
          - pattern: readVarInt($X)
          - focus-metavariable: $X

      - patterns:
          - pattern: readIntText($X)
          - focus-metavariable: $X

      - patterns:
          - pattern: readUIntText($X)
          - focus-metavariable: $X

      - patterns:
          - pattern: deserializeBinary($X)
          - focus-metavariable: $X

      - patterns:
          - pattern: deserializeText($X)
          - focus-metavariable: $X

      - patterns:
          - pattern: $IN.readBinary($X)
          - focus-metavariable: $X

      - patterns:
          - pattern: $IN.readString($X)
          - focus-metavariable: $X

      - patterns:
          - pattern: $IN.deserializeBinary($X)
          - focus-metavariable: $X

      - pattern: $CFG.getString(...)
      - pattern: $CFG.getStringRef(...)
      - pattern: $CFG.getInt(...)
      - pattern: $CFG.getUInt(...)
      - pattern: $CFG.getUInt64(...)
      - pattern: $CFG.getBool(...)
      - pattern: $CFG.getDouble(...)

      - pattern: $REQ.getParameter(...)
      - pattern: $REQ.getQueryParameter(...)
      - pattern: $REQ.getHeader(...)
      - pattern: $REQ.getURI()
      - pattern: $REQ.getPath()
      - pattern: $REQ.getQuery()
      - pattern: $REQ.getHost()
      - pattern: $REQ.getBody()
      - pattern: $REQ.body

      - pattern: nlohmann::json::parse(...)
      - pattern: YAML::Load(...)
      - pattern: cJSON_Parse(...)
      - pattern: cJSON_GetObjectItem(...)
      - pattern: cJSON_GetObjectItemCaseSensitive(...)
      - pattern: $JSON.parse($INPUT)
      - pattern: $PARSER.parse($INPUT)

      - patterns:
          - pattern: $DOC.Parse($INPUT)
          - focus-metavariable: $DOC

      - patterns:
          - pattern: boost::property_tree::read_xml($STREAM, $PT)
          - focus-metavariable: $PT

      - patterns:
          - pattern: boost::property_tree::read_json($STREAM, $PT)
          - focus-metavariable: $PT

      - patterns:
          - pattern: boost::property_tree::read_ini($STREAM, $PT)
          - focus-metavariable: $PT

    pattern-sanitizers:
      - pattern: sizeof(...)
      - pattern: 'sizeof $X'
      - pattern: alignof(...)
      - pattern: std::min(...)
      - pattern: std::min<$T>(...)
      - pattern: std::clamp(...)
      - pattern: std::clamp<$T>(...)
      - pattern: std::numeric_limits<$T>::max()
      - pattern: checked_cast<$T>(...)
      - pattern: Poco::checked_cast<$T>(...)
      - pattern: boost::numeric_cast<$T>(...)
      - pattern: absl::CheckedNumeric<$T>(...)
      - pattern: strnlen($STR, $MAX)
      - pattern: wcsnlen($STR, $MAX)

    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: memcpy($DST, $SRC, $SIZE)
              - pattern: __builtin_memcpy($DST, $SRC, $SIZE)
              - pattern: std::memcpy($DST, $SRC, $SIZE)
              - pattern: memmove($DST, $SRC, $SIZE)
              - pattern: __builtin_memmove($DST, $SRC, $SIZE)
              - pattern: std::memmove($DST, $SRC, $SIZE)
              - pattern: bcopy($SRC, $DST, $SIZE)
              - pattern: memccpy($DST, $SRC, $C, $SIZE)
              - pattern: CopyMemory($DST, $SRC, $SIZE)
              - pattern: RtlCopyMemory($DST, $SRC, $SIZE)

          - pattern-not: memcpy($DST, $SRC, sizeof($X))
          - pattern-not: memcpy($DST, $SRC, 'sizeof $X')
          - pattern-not: __builtin_memcpy($DST, $SRC, sizeof($X))
          - pattern-not: __builtin_memcpy($DST, $SRC, 'sizeof $X')
          - pattern-not: std::memcpy($DST, $SRC, sizeof($X))
          - pattern-not: std::memcpy($DST, $SRC, 'sizeof $X')
          - pattern-not: memmove($DST, $SRC, sizeof($X))
          - pattern-not: memmove($DST, $SRC, 'sizeof $X')
          - pattern-not: __builtin_memmove($DST, $SRC, sizeof($X))
          - pattern-not: __builtin_memmove($DST, $SRC, 'sizeof $X')
          - pattern-not: std::memmove($DST, $SRC, sizeof($X))
          - pattern-not: std::memmove($DST, $SRC, 'sizeof $X')
          - pattern-not: bcopy($SRC, $DST, sizeof($X))
          - pattern-not: bcopy($SRC, $DST, 'sizeof $X')

          - pattern-not: memcpy($DST, $SRC, std::min($A, $B))
          - pattern-not: memcpy($DST, $SRC, std::min<$T>($A, $B))
          - pattern-not: memcpy($DST, $SRC, std::clamp($A, $B, $C))
          - pattern-not: memmove($DST, $SRC, std::min($A, $B))
          - pattern-not: memmove($DST, $SRC, std::min<$T>($A, $B))
          - pattern-not: memmove($DST, $SRC, std::clamp($A, $B, $C))
          - pattern-not: std::memcpy($DST, $SRC, std::min($A, $B))
          - pattern-not: std::memcpy($DST, $SRC, std::min<$T>($A, $B))
          - pattern-not: std::memmove($DST, $SRC, std::min($A, $B))
          - pattern-not: std::memmove($DST, $SRC, std::min<$T>($A, $B))

          - pattern-not-inside: |
              if ($SIZE <= $CAP) {
                ...
              }
          - pattern-not-inside: |
              if ($SIZE < $CAP) {
                ...
              }
          - pattern-not-inside: |
              if ($CAP >= $SIZE) {
                ...
              }
          - pattern-not-inside: |
              if ($CAP > $SIZE) {
                ...
              }
          - pattern-not-inside: |
              assert($SIZE <= $CAP);
              ...
          - pattern-not-inside: |
              assert($SIZE < $CAP);
              ...
          - pattern-not-inside: |
              $SIZE = std::min($A, $B);
              ...
          - pattern-not-inside: |
              $SIZE = std::clamp($A, $B, $C);
              ...

      - patterns:
          - pattern-either:
              - pattern: strcpy($DST, $SRC)
              - pattern: strcat($DST, $SRC)
              - pattern: stpcpy($DST, $SRC)
              - pattern: wcscpy($DST, $SRC)
              - pattern: wcscat($DST, $SRC)
              - pattern: strncpy($DST, $SRC, $SIZE)
              - pattern: strncat($DST, $SRC, $SIZE)
              - pattern: wcsncpy($DST, $SRC, $SIZE)
              - pattern: wcsncat($DST, $SRC, $SIZE)

      - patterns:
          - pattern-either:
              - pattern: sprintf($BUF, $FMT, ...)
              - pattern: vsprintf($BUF, $FMT, $ARGS)

      - patterns:
          - pattern-either:
              - pattern: std::copy($SRC_BEGIN, $SRC_END, $DST)
              - pattern: std::copy_n($SRC, $COUNT, $DST)

  - id: c-memory-unsafe-functions
    languages: [c, cpp]
    severity: ERROR
    message: "Unsafe memory or string operation detected. Fixed-size and explicitly bounded memcpy-style copies are excluded."
    metadata:
      category: memory
      checklist: "11. Memory Safety"
      cwe:
        - "CWE-120: Buffer Copy without Checking Size of Input"
        - "CWE-676: Use of Potentially Dangerous Function"
    patterns:
      - pattern-either:
          - pattern: strcpy($DST, $SRC)
          - pattern: strcat($DST, $SRC)
          - pattern: gets($BUF)
          - pattern: scanf("%s", $ARG)
          - pattern: fscanf($FILE, "%s", $ARG)
          - pattern: sscanf($SRC, "%s", $ARG)

          - patterns:
              - pattern: sprintf($BUF, $FMT, ...)
              - pattern-not: sprintf($BUF, "...", ...)
              - pattern-not: sprintf($BUF, "...")

          - patterns:
              - pattern-either:
                  - pattern: memcpy($DST, $SRC, $SIZE)
                  - pattern: __builtin_memcpy($DST, $SRC, $SIZE)
                  - pattern: std::memcpy($DST, $SRC, $SIZE)
                  - pattern: memmove($DST, $SRC, $SIZE)
                  - pattern: __builtin_memmove($DST, $SRC, $SIZE)
                  - pattern: std::memmove($DST, $SRC, $SIZE)
                  - pattern: bcopy($SRC, $DST, $SIZE)

              - pattern-not: memcpy($DST, $SRC, sizeof($X))
              - pattern-not: memcpy($DST, $SRC, 'sizeof $X')
              - pattern-not: __builtin_memcpy($DST, $SRC, sizeof($X))
              - pattern-not: __builtin_memcpy($DST, $SRC, 'sizeof $X')
              - pattern-not: std::memcpy($DST, $SRC, sizeof($X))
              - pattern-not: std::memcpy($DST, $SRC, 'sizeof $X')
              - pattern-not: memmove($DST, $SRC, sizeof($X))
              - pattern-not: memmove($DST, $SRC, 'sizeof $X')
              - pattern-not: __builtin_memmove($DST, $SRC, sizeof($X))
              - pattern-not: __builtin_memmove($DST, $SRC, 'sizeof $X')
              - pattern-not: std::memmove($DST, $SRC, sizeof($X))
              - pattern-not: std::memmove($DST, $SRC, 'sizeof $X')
              - pattern-not: bcopy($SRC, $DST, sizeof($X))
              - pattern-not: bcopy($SRC, $DST, 'sizeof $X')

              - pattern-not: memcpy($DST, $SRC, std::min($A, $B))
              - pattern-not: memcpy($DST, $SRC, std::min<$T>($A, $B))
              - pattern-not: memcpy($DST, $SRC, std::clamp($A, $B, $C))
              - pattern-not: memmove($DST, $SRC, std::min($A, $B))
              - pattern-not: memmove($DST, $SRC, std::min<$T>($A, $B))
              - pattern-not: memmove($DST, $SRC, std::clamp($A, $B, $C))
              - pattern-not: std::memcpy($DST, $SRC, std::min($A, $B))
              - pattern-not: std::memcpy($DST, $SRC, std::min<$T>($A, $B))
              - pattern-not: std::memmove($DST, $SRC, std::min($A, $B))
              - pattern-not: std::memmove($DST, $SRC, std::min<$T>($A, $B))

              - pattern-not-inside: |
                  if ($SIZE <= $CAP) {
                    ...
                  }
              - pattern-not-inside: |
                  if ($SIZE < $CAP) {
                    ...
                  }
              - pattern-not-inside: |
                  if ($CAP >= $SIZE) {
                    ...
                  }
              - pattern-not-inside: |
                  if ($CAP > $SIZE) {
                    ...
                  }
              - pattern-not-inside: |
                  assert($SIZE <= $CAP);
                  ...
              - pattern-not-inside: |
                  assert($SIZE < $CAP);
                  ...
              - pattern-not-inside: |
                  $SIZE = std::min($A, $B);
                  ...
              - pattern-not-inside: |
                  $SIZE = std::clamp($A, $B, $C);
                  ...

              - metavariable-pattern:
                  metavariable: $SIZE
                  patterns:
                    - pattern-not-regex: '^\s*([0-9]+[uUlL]*|std::min\s*(<[^>]*>)?\s*\([^()]*\)|std::clamp\s*(<[^>]*>)?\s*\([^()]*\))\s*$'

  - id: cpp-taint-untrusted-allocation-arithmetic
    mode: taint
    languages: [c, cpp]
    severity: ERROR
    message: "Untrusted input participates in allocation arithmetic without an overflow-safe computation."
    metadata:
      category: memory
      checklist: "11. Memory Safety"
      cwe:
        - "CWE-190: Integer Overflow or Wraparound"
        - "CWE-122: Heap-based Buffer Overflow"
      confidence: HIGH
    options:
      symbolic_propagation: true
    pattern-sources: *untrusted_input_sources
    pattern-sanitizers:
      - pattern: __builtin_mul_overflow(...)
      - pattern: __builtin_add_overflow(...)
      - pattern: __builtin_sub_overflow(...)
      - pattern: std::min(...)
      - pattern: std::min<$T>(...)
      - pattern: std::clamp(...)
      - pattern: std::clamp<$T>(...)
      - pattern: checked_cast<$T>(...)
      - pattern: Poco::checked_cast<$T>(...)
      - pattern: boost::numeric_cast<$T>(...)
      - pattern: absl::CheckedNumeric<$T>(...)
      - pattern: base::CheckMul(...)
      - pattern: base::CheckAdd(...)
      - pattern: CheckedMul(...)
      - pattern: CheckedAdd(...)
      - pattern: safe_mul(...)
      - pattern: safe_add(...)

    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: malloc($X * $Y)
              - pattern: malloc($X + $Y)
              - pattern: malloc($X << $SHIFT)
              - pattern: realloc($PTR, $X * $Y)
              - pattern: realloc($PTR, $X + $Y)
              - pattern: realloc($PTR, $X << $SHIFT)
              - pattern: calloc($X * $Y, $Z)
              - pattern: calloc($X, $Y * $Z)
              - pattern: calloc($X + $Y, $Z)
              - pattern: alloca($X * $Y)
              - pattern: alloca($X + $Y)
              - pattern: aligned_alloc($ALIGN, $X * $Y)
              - pattern: aligned_alloc($ALIGN, $X + $Y)
              - pattern: posix_memalign($PTR, $ALIGN, $X * $Y)
              - pattern: new $T[$X * $Y]
              - pattern: new $T[$X + $Y]
              - pattern: new $T[$X << $SHIFT]
              - pattern: std::make_unique<$T[]>($X * $Y)
              - pattern: std::make_unique<$T[]>($X + $Y)
              - pattern: std::make_unique<$T[]>($X << $SHIFT)

          - pattern-not-inside: |
              if (__builtin_mul_overflow($X, $Y, ...)) {
                ...
              }
          - pattern-not-inside: |
              if (__builtin_add_overflow($X, $Y, ...)) {
                ...
              }
          - pattern-not-inside: |
              if ($X > $MAX / $Y) {
                ...
              }
          - pattern-not-inside: |
              if ($Y > $MAX / $X) {
                ...
              }
          - pattern-not-inside: |
              if ($Y != 0 && $X > $MAX / $Y) {
                ...
              }
          - pattern-not-inside: |
              if ($X > std::numeric_limits<$SIZE_T>::max() / $Y) {
                ...
              }
          - pattern-not-inside: |
              if ($X <= $MAX - $Y) {
                ...
              }
          - pattern-not-inside: |
              $OK = __builtin_mul_overflow($X, $Y, ...);
              ...
          - pattern-not-inside: |
              $OK = __builtin_add_overflow($X, $Y, ...);
              ...

  - id: cpp-integer-overflow-in-allocation
    languages: [c, cpp]
    severity: WARNING
    message: "Allocation size uses raw arithmetic. Add explicit overflow checks before allocating."
    metadata:
      category: memory
      checklist: "11. Memory Safety"
      cwe:
        - "CWE-190: Integer Overflow or Wraparound"
        - "CWE-131: Incorrect Calculation of Buffer Size"
    patterns:
      - pattern-either:
          - pattern: malloc($X * $Y)
          - pattern: malloc($X + $Y)
          - pattern: malloc($X << $SHIFT)
          - pattern: realloc($PTR, $X * $Y)
          - pattern: realloc($PTR, $X + $Y)
          - pattern: realloc($PTR, $X << $SHIFT)
          - pattern: calloc($X * $Y, $Z)
          - pattern: calloc($X, $Y * $Z)
          - pattern: calloc($X + $Y, $Z)
          - pattern: alloca($X * $Y)
          - pattern: alloca($X + $Y)
          - pattern: aligned_alloc($ALIGN, $X * $Y)
          - pattern: aligned_alloc($ALIGN, $X + $Y)
          - pattern: posix_memalign($PTR, $ALIGN, $X * $Y)
          - pattern: new $T[$X * $Y]
          - pattern: new $T[$X + $Y]
          - pattern: new $T[$X << $SHIFT]
          - pattern: std::make_unique<$T[]>($X * $Y)
          - pattern: std::make_unique<$T[]>($X + $Y)
          - pattern: std::make_unique<$T[]>($X << $SHIFT)

      - pattern-not-inside: |
          if (__builtin_mul_overflow($X, $Y, ...)) {
            ...
          }
      - pattern-not-inside: |
          if (__builtin_add_overflow($X, $Y, ...)) {
            ...
          }
      - pattern-not-inside: |
          if ($X > $MAX / $Y) {
            ...
          }
      - pattern-not-inside: |
          if ($Y > $MAX / $X) {
            ...
          }
      - pattern-not-inside: |
          if ($Y != 0 && $X > $MAX / $Y) {
            ...
          }
      - pattern-not-inside: |
          if ($X > std::numeric_limits<$SIZE_T>::max() / $Y) {
            ...
          }
      - pattern-not-inside: |
          if ($X <= $MAX - $Y) {
            ...
          }
      - pattern-not-inside: |
          if (($X + $Y) < $X) {
            ...
          }
      - pattern-not-inside: |
          if (($X * $Y) / $Y != $X) {
            ...
          }
      - pattern-not-inside: |
          $OK = __builtin_mul_overflow($X, $Y, ...);
          ...
      - pattern-not-inside: |
          $OK = __builtin_add_overflow($X, $Y, ...);
          ...

  - id: cpp-taint-format-string-injection
    mode: taint
    languages: [c, cpp]
    severity: ERROR
    message: "Untrusted data is used as a format string or log message. Use a fixed format such as \"%s\" and pass untrusted data as an argument."
    metadata:
      category: injection
      checklist: "1. Injection"
      cwe:
        - "CWE-134: Use of Externally-Controlled Format String"
      confidence: HIGH
    options:
      symbolic_propagation: true
    pattern-sources: *untrusted_input_sources
    pattern-sinks:
      - patterns:
          - pattern: printf($FMT, ...)
          - focus-metavariable: $FMT
      - patterns:
          - pattern: fprintf($FILE, $FMT, ...)
          - focus-metavariable: $FMT
      - patterns:
          - pattern: sprintf($BUF, $FMT, ...)
          - focus-metavariable: $FMT
      - patterns:
          - pattern: snprintf($BUF, $SIZE, $FMT, ...)
          - focus-metavariable: $FMT
      - patterns:
          - pattern: vprintf($FMT, $ARGS)
          - focus-metavariable: $FMT
      - patterns:
          - pattern: vsprintf($BUF, $FMT, $ARGS)
          - focus-metavariable: $FMT
      - patterns:
          - pattern: vsnprintf($BUF, $SIZE, $FMT, $ARGS)
          - focus-metavariable: $FMT
      - patterns:
          - pattern: syslog($PRI, $FMT, ...)
          - focus-metavariable: $FMT
      - patterns:
          - pattern: err($STATUS, $FMT, ...)
          - focus-metavariable: $FMT
      - patterns:
          - pattern: warn($FMT, ...)
          - focus-metavariable: $FMT
      - patterns:
          - pattern: warnx($FMT, ...)
          - focus-metavariable: $FMT
      - patterns:
          - pattern: fmt::print($FMT, ...)
          - focus-metavariable: $FMT
      - patterns:
          - pattern: fmt::format($FMT, ...)
          - focus-metavariable: $FMT

      - patterns:
          - pattern: LOG_ERROR($LOGGER, $MSG)
          - focus-metavariable: $MSG
      - patterns:
          - pattern: LOG_WARNING($LOGGER, $MSG)
          - focus-metavariable: $MSG
      - patterns:
          - pattern: LOG_INFO($LOGGER, $MSG)
          - focus-metavariable: $MSG
      - patterns:
          - pattern: LOG_DEBUG($LOGGER, $MSG)
          - focus-metavariable: $MSG
      - patterns:
          - pattern: LOG_TRACE($LOGGER, $MSG)
          - focus-metavariable: $MSG

      - patterns:
          - pattern: LOG_ERROR($MSG)
          - focus-metavariable: $MSG
      - patterns:
          - pattern: LOG_WARNING($MSG)
          - focus-metavariable: $MSG
      - patterns:
          - pattern: LOG_INFO($MSG)
          - focus-metavariable: $MSG
      - patterns:
          - pattern: LOG_DEBUG($MSG)
          - focus-metavariable: $MSG
      - patterns:
          - pattern: LOG_TRACE($MSG)
          - focus-metavariable: $MSG

      - patterns:
          - pattern: spdlog::trace($MSG, ...)
          - focus-metavariable: $MSG
      - patterns:
          - pattern: spdlog::debug($MSG, ...)
          - focus-metavariable: $MSG
      - patterns:
          - pattern: spdlog::info($MSG, ...)
          - focus-metavariable: $MSG
      - patterns:
          - pattern: spdlog::warn($MSG, ...)
          - focus-metavariable: $MSG
      - patterns:
          - pattern: spdlog::error($MSG, ...)
          - focus-metavariable: $MSG
      - patterns:
          - pattern: spdlog::critical($MSG, ...)
          - focus-metavariable: $MSG

      - patterns:
          - pattern: $LOGGER.error($MSG, ...)
          - focus-metavariable: $MSG
      - patterns:
          - pattern: $LOGGER.warning($MSG, ...)
          - focus-metavariable: $MSG
      - patterns:
          - pattern: $LOGGER.info($MSG, ...)
          - focus-metavariable: $MSG
      - patterns:
          - pattern: $LOGGER.debug($MSG, ...)
          - focus-metavariable: $MSG
      - patterns:
          - pattern: $LOGGER.log($LEVEL, $MSG, ...)
          - focus-metavariable: $MSG

  - id: c-use-after-free
    languages: [c, cpp]
    severity: ERROR
    message: "Pointer is dereferenced after deallocation. This is undefined behavior and may be exploitable."
    metadata:
      category: memory
      checklist: "11. Memory Safety"
      cwe:
        - "CWE-416: Use After Free"
    patterns:
      - pattern-either:
          - pattern: $P->$FIELD
          - pattern: "*$P"
          - pattern: $P[$IDX]

      - pattern-either:
          - pattern-inside: |
              free($P);
              ...
          - pattern-inside: |
              delete $P;
              ...
          - pattern-inside: |
              delete[] $P;
              ...

      - pattern-not-inside: |
          free($P);
          ...
          $P = $VAL;
          ...
      - pattern-not-inside: |
          delete $P;
          ...
          $P = $VAL;
          ...
      - pattern-not-inside: |
          delete[] $P;
          ...
          $P = $VAL;
          ...

  - id: c-double-free
    languages: [c, cpp]
    severity: ERROR
    message: "Pointer may be deallocated more than once without being reset."
    metadata:
      category: memory
      checklist: "11. Memory Safety"
      cwe:
        - "CWE-415: Double Free"
    patterns:
      - pattern-either:
          - pattern: free($P)
          - pattern: delete $P
          - pattern: delete[] $P

      - pattern-either:
          - pattern-inside: |
              free($P);
              ...
              free($P);
          - pattern-inside: |
              delete $P;
              ...
              delete $P;
          - pattern-inside: |
              delete[] $P;
              ...
              delete[] $P;

      - pattern-not-inside: |
          free($P);
          ...
          $P = $VAL;
          ...
          free($P);
      - pattern-not-inside: |
          delete $P;
          ...
          $P = $VAL;
          ...
          delete $P;
      - pattern-not-inside: |
          delete[] $P;
          ...
          $P = $VAL;
          ...
          delete[] $P;

  - id: cpp-off-by-one-boundary
    languages: [c, cpp]
    severity: WARNING
    message: "Boundary check or loop uses <= against a size/count. Array indexing may be off by one."
    metadata:
      category: memory
      checklist: "11. Memory Safety"
      cwe:
        - "CWE-193: Off-by-one Error"
        - "CWE-125: Out-of-bounds Read"
        - "CWE-787: Out-of-bounds Write"
    patterns:
      - pattern-either:
          - pattern: |
              for ($I = $START; $I <= $SIZE; ...) {
                ...
                $ARR[$I]
                ...
              }
          - pattern: |
              for ($I = $START; $I <= $SIZE; ...) {
                ...
                $ARR[$I] = $VAL
                ...
              }
          - pattern: |
              while ($I <= $SIZE) {
                ...
                $ARR[$I]
                ...
              }
          - pattern: |
              while ($I <= $SIZE) {
                ...
                $ARR[$I] = $VAL
                ...
              }
          - pattern: |
              if ($IDX <= $SIZE) {
                ...
                $ARR[$IDX]
                ...
              }
          - pattern: |
              if ($IDX <= sizeof($BUF) / sizeof($BUF[0])) {
                ...
                $ARR[$IDX]
                ...
              }
          - pattern: |
              if ($IDX <= sizeof($BUF)) {
                ...
                $ARR[$IDX]
                ...
              }
          - pattern: |
              if ($IDX <= $BUF.size()) {
                ...
                $ARR[$IDX]
                ...
              }

      - pattern-not-inside: |
          for ($I = $START; $I <= $SIZE - 1; ...) {
            ...
          }
      - pattern-not-inside: |
          while ($I <= $SIZE - 1) {
            ...
          }
      - pattern-not-inside: |
          if ($IDX <= $SIZE - 1) {
            ...
          }
      - pattern-not-inside: |
          if ($SIZE > 0 && $IDX <= $SIZE - 1) {
            ...
          }
