---
# =============================================================================
# Semgrep ruleset - source-code security audit of C/C++ (tuned for ClickHouse)
# Aligned to: "Master Source-Code Security Audit Checklist" (sections A-Q).
# Every rule carries  metadata.checklist (section)  and  metadata.checklist_ids.
#
# Recommended invocation (the YAML cannot carry CLI limits; these prevent
# AST/taint timeouts on huge translation units):
#
#   semgrep scan --config rules.yaml --metrics=off \
#     --timeout 20 --timeout-threshold 3 --max-target-bytes 1500000 \
#     --max-memory 4000 --jobs 8 --severity ERROR --severity WARNING \
#     --json --output semgrep-findings.json  src/ base/ programs/
#   (add --severity INFO to also see the low-confidence advisory rules)
#
# Record in the audit report (TST-11): semgrep version, this file's hash, the
# exact command line, excluded paths (contrib/, tests/, benchmarks/, build*/),
# and any partial-parse warnings.
#
# Taint rules are intra-procedural in Semgrep OSS (flow is tracked within one
# function body). Cross-function flow requires Semgrep Pro (--pro).
#
# -----------------------------------------------------------------------------
# CHECKLIST -> RULE COVERAGE   (a clean scan is NOT a PASS - see REP-07)
# -----------------------------------------------------------------------------
#  INJ-01              c-tainted-memory-copy / -command-exec / -path-access / -sql-query,
#                      c-format-string-tainted
#  INJ-02, INJ-12, DB-01   c-tainted-sql-query
#  INJ-03, OS-04, OS-05    c-os-command-injection, c-tainted-command-exec
#  INJ-07, WEB-07          c-xxe-unsafe-xml-parser
#  INJ-08, OS-01, OS-07    c-tainted-path-access, c-world-writable-permissions
#  CRY-01/02/05            c-broken-crypto-algorithm, c-weak-hash-algorithm (INFO)
#  CRY-03, AUTH-10, CFG-02 c-hardcoded-crypto-key-or-iv, c-hardcoded-credentials,
#                          secrets-known-key-patterns, iac-dockerfile-secret-in-env
#  CRY-06              c-insecure-random-for-security
#  CRY-08              c-tls-verification-disabled
#  CRY-10, LOG-03      c-sensitive-data-in-log
#  AUTH-01/03 (timing) c-non-constant-time-secret-compare
#  MEM-01              c-memory-unsafe-functions, c-off-by-one-bounds, c-sizeof-pointer-parameter
#  MEM-02              c-use-after-free, cpp-use-after-delete, c-double-free
#  MEM-03              c-unchecked-malloc-null-deref
#  MEM-05              c-alloc-integer-overflow, c-length-narrowing-cast
#  MEM-07, LOG-04      c-format-string, c-format-string-tainted, cpp-fmt-runtime-nonliteral
#  MEM-08, OS-02       c-non-reentrant-libc-function, c-toctou-access-then-open
#  OS-03               c-unchecked-privilege-drop
#  OS-06               c-insecure-temp-file
#  BUS-06              cpp-std-regex-dos (INFO)
#  SUP-03/05/07/08     iac-gha-*, iac-dockerfile-*   |   CFG-05/06: iac-k8s-*, iac-terraform-*
#
# NOT DETECTABLE BY THIS RULESET -> record as UNVERIFIED unless covered elsewhere:
#  MEM-04 uninitialized memory (MSan, clang-tidy)   MEM-06 type confusion / lifetimes
#  MEM-09/10 ownership & unsafe review (manual)      MEM-11 hardening flags (inspect build:
#  -fstack-protector-strong, -D_FORTIFY_SOURCE=2, -fPIE, -Wl,-z,relro,-z,now, CFI)
#  MEM-12/TST-07 ASan/UBSan/MSan/TSan + fuzzing (libFuzzer)   TST-02 clang-tidy / -Wall -Wextra
#  AUTH-02/04/06-09, ACL-*, API-*, WEB-01..06/08..10, BUS-01..05/07..10, DB-02..10,
#  LOG-01/02/04..08, CFG-01/03/07..10, PRV-*   (design/semantic: manual review, auth tests, DAST)
#  SUP-01/02/04/06/09/10 SBOM + OSV/Dependency-Check   TST-04 history secret scan (gitleaks)
#  P-*, REP-*, TST-03/05/06/08..12   (process/evidence items, not source patterns)
# =============================================================================
rules:
  # ---------------------------------------------------------------------------
  # 1. Unsafe libc functions + unbounded memcpy/memmove (pattern based)
  #    memcpy/memmove is NOT reported when the length is: sizeof(...), n*sizeof(...),
  #    a literal, std::min/clamp(...), or guarded by a visible bounds check.
  # ---------------------------------------------------------------------------
  - id: c-memory-unsafe-functions
    languages: [c, cpp]
    severity: WARNING
    message: >-
      Unsafe memory/string function with no visible bound. Replace strcpy/strcat/sprintf/gets
      with bounded alternatives (snprintf, std::string, std::string_view), and validate the
      length of memcpy/memmove against the destination capacity (e.g. std::min or an explicit check).
    metadata:
      category: memory
      cwe: ["CWE-120: Buffer Copy without Checking Size of Input", "CWE-676: Use of Potentially Dangerous Function"]
      checklist: "H. Memory safety and language-specific weaknesses"
      checklist_ids: [MEM-01]
      confidence: MEDIUM
      technology: [c, cpp]
    paths:
      exclude:
        - "**/contrib/**"
        - "**/tests/**"
        - "**/benchmarks/**"
        - "**/gtest_*"
        - "**/build/**"
        - "**/build_*/**"
    pattern-either:
      - pattern: strcpy(...)
      - pattern: stpcpy(...)
      - pattern: strcat(...)
      - pattern: sprintf(...)
      - pattern: vsprintf(...)
      - pattern: gets(...)
      - pattern: 'scanf("%s", ...)'
      - patterns:
          - pattern-either:
              - pattern: memcpy($D, $S, $LEN)
              - pattern: std::memcpy($D, $S, $LEN)
              - pattern: memmove($D, $S, $LEN)
              - pattern: std::memmove($D, $S, $LEN)
          # fixed-size / type-safe lengths
          - pattern-not: $F($D, $S, sizeof(...))
          - pattern-not: $F($D, $S, sizeof ...)
          - pattern-not: $F($D, $S, $N * sizeof(...))
          - pattern-not: $F($D, $S, sizeof(...) * $N)
          - pattern-not: $F($D, $S, std::size(...))
          - pattern-not: $F($D, $S, std::min(...))
          - pattern-not: $F($D, $S, std::min<$T>(...))
          - pattern-not: $F($D, $S, min(...))
          - pattern-not: $F($D, $S, std::clamp(...))
          # numeric literal length
          - metavariable-regex:
              metavariable: $LEN
              regex: '^(?!\s*(0[xX][0-9a-fA-F]+|\d+)[uUlLzZ]*\s*$)'
          # guarded by a visible bounds check on the same length expression
          - pattern-not-inside: |
              if (<... $LEN < $M ...>) { ... }
          - pattern-not-inside: |
              if (<... $LEN <= $M ...>) { ... }
          - pattern-not-inside: |
              if (<... $M > $LEN ...>) { ... }
          - pattern-not-inside: |
              if (<... $M >= $LEN ...>) { ... }
          - pattern-not-inside: |
              if (<... $LEN > $M ...>) { ...; throw ...; }
              ...
          - pattern-not-inside: |
              if (<... $LEN >= $M ...>) { ...; throw ...; }
              ...
          - pattern-not-inside: |
              if (<... $LEN > $M ...>) { ...; return ...; }
              ...
          - pattern-not-inside: |
              if (<... $LEN >= $M ...>) { ...; return ...; }
              ...
          - pattern-not-inside: |
              if (<... $LEN > $M ...>) throw ...;
              ...
          - pattern-not-inside: |
              if (<... $LEN > $M ...>) return ...;
              ...
          - pattern-not-inside: |
              assert(<... $LEN ...>);
              ...
          - pattern-not-inside: |
              chassert(<... $LEN ...>);
              ...
  # ---------------------------------------------------------------------------
  # 2. TAINT: untrusted length/pointer/string -> unsafe memory copy
  # ---------------------------------------------------------------------------
  - id: c-tainted-memory-copy
    mode: taint
    languages: [c, cpp]
    severity: ERROR
    message: >-
      Untrusted data (network read, HTTP request, config value or deserialized value) reaches the
      length, destination or source argument of an unsafe memory/string copy without a bounds check.
      Validate against the destination capacity (std::min, explicit limit + throw) before copying.
    metadata:
      category: memory
      cwe: ["CWE-120: Buffer Copy without Checking Size of Input", "CWE-787: Out-of-bounds Write", "CWE-805: Buffer Access with Incorrect Length Value"]
      checklist: "H. Memory safety and language-specific weaknesses"
      checklist_ids: [MEM-01, MEM-05, INJ-01]
      confidence: HIGH
      technology: [c, cpp]
    paths:
      exclude:
        - "**/contrib/**"
        - "**/tests/**"
        - "**/benchmarks/**"
        - "**/gtest_*"
        - "**/build/**"
        - "**/build_*/**"
    options:
      taint_assume_safe_booleans: true
      taint_assume_safe_comparisons: true
    pattern-sources:
      # return values of libc socket/file reads (error return -1 -> huge size_t)
      - patterns:
          - pattern-either:
              - pattern: recv(...)
              - pattern: recvfrom(...)
              - pattern: recvmsg(...)
              - pattern: read($FD, ...)
              - pattern: SSL_read(...)
              - pattern: BIO_read(...)
          - pattern-not: read($FD, $BUF, sizeof(...))
      # attacker-controlled scalar values
      - pattern-either:
          - pattern: $REQ.getContentLength()
          - pattern: $REQ.getContentLength64()
          - pattern: $REQ.getURI()
          - pattern: $REQ.getHost()
          - pattern: $REQ.getCookies(...)
          - pattern: $CFG.getUInt64(...)
          - pattern: $CFG.getUInt(...)
          - pattern: $CFG.getInt64(...)
          - pattern: $CFG.getInt(...)
          - pattern: $CFG.getString(...)
          - pattern: $CFG.getRawString(...)
          - pattern: getenv(...)
          - pattern: std::getenv(...)
      # data written into out-parameters by network / stream / deserialization readers
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: recv($FD, $OUT, ...)
              - pattern: recvfrom($FD, $OUT, ...)
              - pattern: read($FD, $OUT, ...)
              - pattern: SSL_read($S, $OUT, ...)
              - pattern: BIO_read($S, $OUT, ...)
              - pattern: $IN.read($OUT, ...)
              - pattern: $IN.readStrict($OUT, ...)
              - pattern: $IN.readBig($OUT, ...)
              - pattern: $SOCK.receiveBytes($OUT, ...)
              - pattern: $SOCK.receiveFrom($OUT, ...)
              - patterns:
                  - pattern: $F($OUT, ...)
                  - metavariable-regex:
                      metavariable: $F
                      regex: '^(DB::)?(readVarUInt|readVarInt|readBinary|readIntBinary|readFloatBinary|readStringBinary|readPODBinary|readBinaryBigEndian|readIntText|readFloatText|readEscapedString|readQuotedString|readCSVString|readDoubleQuotedString|deserialize\w*)$'
              - patterns:
                  - pattern: $OBJ.$M($OUT, ...)
                  - metavariable-regex:
                      metavariable: $M
                      regex: '^(deserialize\w*|readBinary\w*)$'
          - focus-metavariable: $OUT
    pattern-sanitizers:
      - pattern-either:
          - pattern: std::min(...)
          - pattern: std::min<$T>(...)
          - pattern: min(...)
          - pattern: std::clamp(...)
          - pattern: sizeof(...)
          - pattern: sizeof ...
          - pattern: std::size(...)
      - patterns:
          - pattern: $X
          - metavariable-regex:
              metavariable: $X
              regex: '^[A-Za-z_][A-Za-z0-9_]*(\.[A-Za-z_][A-Za-z0-9_]*|->[A-Za-z_][A-Za-z0-9_]*|::[A-Za-z_][A-Za-z0-9_]*)*$'
          - pattern-either:
              - pattern-inside: |
                  if (<... $X < $M ...>) { ... }
              - pattern-inside: |
                  if (<... $X <= $M ...>) { ... }
              - pattern-inside: |
                  if (<... $M > $X ...>) { ... }
              - pattern-inside: |
                  if (<... $M >= $X ...>) { ... }
              - pattern-inside: |
                  if (<... $X > $M ...>) { ...; throw ...; }
                  ...
              - pattern-inside: |
                  if (<... $X >= $M ...>) { ...; throw ...; }
                  ...
              - pattern-inside: |
                  if (<... $M < $X ...>) { ...; throw ...; }
                  ...
              - pattern-inside: |
                  if (<... $X > $M ...>) { ...; return ...; }
                  ...
              - pattern-inside: |
                  if (<... $X >= $M ...>) { ...; return ...; }
                  ...
              - pattern-inside: |
                  if (<... $X > $M ...>) throw ...;
                  ...
              - pattern-inside: |
                  if (<... $X > $M ...>) return ...;
                  ...
              - pattern-inside: |
                  assert(<... $X ...>);
                  ...
              - pattern-inside: |
                  chassert(<... $X ...>);
                  ...
    pattern-sinks:
      # untrusted LENGTH
      - patterns:
          - pattern-either:
              - pattern: memcpy($D, $S, $LEN)
              - pattern: std::memcpy($D, $S, $LEN)
              - pattern: memmove($D, $S, $LEN)
              - pattern: std::memmove($D, $S, $LEN)
              - pattern: memcpy_fast($D, $S, $LEN)
              - pattern: memcpySmallAllowReadWriteOverflow15($D, $S, $LEN)
              - pattern: strncpy($D, $S, $LEN)
              - pattern: strncat($D, $S, $LEN)
              - pattern: alloca($LEN)
          - focus-metavariable: $LEN
      # untrusted destination POINTER
      - patterns:
          - pattern-either:
              - pattern: memcpy($D, $S, $LEN)
              - pattern: std::memcpy($D, $S, $LEN)
              - pattern: memmove($D, $S, $LEN)
              - pattern: std::memmove($D, $S, $LEN)
          - focus-metavariable: $D
      # untrusted unbounded SOURCE string
      - patterns:
          - pattern-either:
              - pattern: strcpy($D, $S)
              - pattern: stpcpy($D, $S)
              - pattern: strcat($D, $S)
          - focus-metavariable: $S
      # untrusted data formatted into a fixed buffer
      - patterns:
          - pattern-either:
              - pattern: sprintf($D, $FMT, ..., $A, ...)
              - pattern: std::sprintf($D, $FMT, ..., $A, ...)
          - focus-metavariable: $A
  # ---------------------------------------------------------------------------
  # 3. Integer overflow in allocation size arithmetic
  #    Flags a*b / a+b / a<<b inside allocation calls unless both operands are
  #    constants, or an overflow / range check is visible before the call.
  # ---------------------------------------------------------------------------
  - id: c-alloc-integer-overflow
    languages: [c, cpp]
    severity: WARNING
    message: >-
      Arithmetic inside an allocation size can overflow and wrap to a small allocation
      (heap overflow). Use __builtin_mul_overflow/__builtin_add_overflow (or common::mulOverflow),
      check against std::numeric_limits<size_t>::max() / n, or use calloc / std::vector.
    metadata:
      category: memory
      cwe: ["CWE-190: Integer Overflow or Wraparound", "CWE-680: Integer Overflow to Buffer Overflow"]
      checklist: "H. Memory safety and language-specific weaknesses"
      checklist_ids: [MEM-05, MEM-01]
      confidence: MEDIUM
      technology: [c, cpp]
    paths:
      exclude:
        - "**/contrib/**"
        - "**/tests/**"
        - "**/benchmarks/**"
        - "**/gtest_*"
        - "**/build/**"
        - "**/build_*/**"
    patterns:
      - pattern-either:
          # a * b  (flag when at least one operand is non-constant)
          - patterns:
              - pattern: $ALLOC(..., $A * $B)
              - metavariable-regex:
                  metavariable: $ALLOC
                  regex: '^((::)?std::|.*(\.|->|::))?(malloc|realloc|aligned_alloc|alloca|alloc|allocate|operator new|operator new\[\])$'
              - metavariable-regex:
                  metavariable: $A
                  regex: '^(?!\s*(0[xX][0-9a-fA-F]+|\d+)[uUlLzZ]*\s*$)(?!\s*(sizeof|std::size|alignof)\b)'
          - patterns:
              - pattern: $ALLOC(..., $A * $B)
              - metavariable-regex:
                  metavariable: $ALLOC
                  regex: '^((::)?std::|.*(\.|->|::))?(malloc|realloc|aligned_alloc|alloca|alloc|allocate|operator new|operator new\[\])$'
              - metavariable-regex:
                  metavariable: $B
                  regex: '^(?!\s*(0[xX][0-9a-fA-F]+|\d+)[uUlLzZ]*\s*$)(?!\s*(sizeof|std::size|alignof)\b)'
          # a + b  (flag only when both operands are non-constant)
          - patterns:
              - pattern: $ALLOC(..., $A + $B)
              - metavariable-regex:
                  metavariable: $ALLOC
                  regex: '^((::)?std::|.*(\.|->|::))?(malloc|realloc|aligned_alloc|alloca|alloc|allocate|operator new|operator new\[\])$'
              - metavariable-regex:
                  metavariable: $A
                  regex: '^(?!\s*(0[xX][0-9a-fA-F]+|\d+)[uUlLzZ]*\s*$)(?!\s*(sizeof|std::size|alignof)\b)'
              - metavariable-regex:
                  metavariable: $B
                  regex: '^(?!\s*(0[xX][0-9a-fA-F]+|\d+)[uUlLzZ]*\s*$)(?!\s*(sizeof|std::size|alignof)\b)'
          # a << b (flag when the shift amount is non-constant)
          - patterns:
              - pattern: $ALLOC(..., $A << $B)
              - metavariable-regex:
                  metavariable: $ALLOC
                  regex: '^((::)?std::|.*(\.|->|::))?(malloc|realloc|aligned_alloc|alloca|alloc|allocate|operator new|operator new\[\])$'
              - metavariable-regex:
                  metavariable: $B
                  regex: '^(?!\s*(0[xX][0-9a-fA-F]+|\d+)[uUlLzZ]*\s*$)'
          # new T[a * b] / new T[a + b]
          - patterns:
              - pattern: new $T[$A * $B]
              - metavariable-regex:
                  metavariable: $A
                  regex: '^(?!\s*(0[xX][0-9a-fA-F]+|\d+)[uUlLzZ]*\s*$)(?!\s*(sizeof|std::size|alignof)\b)'
          - patterns:
              - pattern: new $T[$A * $B]
              - metavariable-regex:
                  metavariable: $B
                  regex: '^(?!\s*(0[xX][0-9a-fA-F]+|\d+)[uUlLzZ]*\s*$)(?!\s*(sizeof|std::size|alignof)\b)'
          - patterns:
              - pattern: new $T[$A + $B]
              - metavariable-regex:
                  metavariable: $A
                  regex: '^(?!\s*(0[xX][0-9a-fA-F]+|\d+)[uUlLzZ]*\s*$)(?!\s*(sizeof|std::size|alignof)\b)'
              - metavariable-regex:
                  metavariable: $B
                  regex: '^(?!\s*(0[xX][0-9a-fA-F]+|\d+)[uUlLzZ]*\s*$)(?!\s*(sizeof|std::size|alignof)\b)'
      # explicit overflow checks that dominate the allocation
      - pattern-not-inside: |
          if (<... __builtin_mul_overflow(...) ...>) { ... }
          ...
      - pattern-not-inside: |
          if (<... __builtin_add_overflow(...) ...>) { ... }
          ...
      - pattern-not-inside: |
          if (<... __builtin_umull_overflow(...) ...>) { ... }
          ...
      - pattern-not-inside: |
          if (<... common::mulOverflow(...) ...>) { ... }
          ...
      - pattern-not-inside: |
          if (<... common::addOverflow(...) ...>) { ... }
          ...
      - pattern-not-inside: |
          if (<... mulOverflow(...) ...>) { ... }
          ...
      - pattern-not-inside: |
          if (<... addOverflow(...) ...>) { ... }
          ...
      - pattern-not-inside: |
          if (<... $A > std::numeric_limits<$T>::max() / $B ...>) { ... }
          ...
      - pattern-not-inside: |
          if (<... $B > std::numeric_limits<$T>::max() / $A ...>) { ... }
          ...
      - pattern-not-inside: |
          if (<... $A > $M ...>) { ...; throw ...; }
          ...
      - pattern-not-inside: |
          if (<... $B > $M ...>) { ...; throw ...; }
          ...
      - pattern-not-inside: |
          if (<... $A > $M ...>) { ...; return ...; }
          ...
      - pattern-not-inside: |
          if (<... $B > $M ...>) { ...; return ...; }
          ...
      - pattern-not-inside: |
          if (<... $A >= $M ...>) { ...; throw ...; }
          ...
      - pattern-not-inside: |
          if (<... $B >= $M ...>) { ...; throw ...; }
          ...
      - pattern-not-inside: |
          if (<... $A < $M ...>) { ... }
      - pattern-not-inside: |
          if (<... $B < $M ...>) { ... }
      - pattern-not-inside: |
          if (<... $A <= $M ...>) { ... }
      - pattern-not-inside: |
          if (<... $B <= $M ...>) { ... }
  # ---------------------------------------------------------------------------
  # 4a. Format string: non-literal format argument (pattern based)
  # ---------------------------------------------------------------------------
  - id: c-format-string
    languages: [c, cpp]
    severity: WARNING
    message: >-
      Non-literal format string. If any part is attacker-controlled this allows memory
      disclosure/corruption via %n/%s/%x. Pass data as an argument with an explicit format
      specifier, e.g. printf("%s", data).
    metadata:
      category: memory
      cwe: ["CWE-134: Use of Externally-Controlled Format String"]
      checklist: "H. Memory safety and language-specific weaknesses"
      checklist_ids: [MEM-07]
      confidence: MEDIUM
      technology: [c, cpp]
    paths:
      exclude:
        - "**/contrib/**"
        - "**/tests/**"
        - "**/benchmarks/**"
        - "**/gtest_*"
        - "**/build/**"
        - "**/build_*/**"
    patterns:
      - pattern-either:
          - pattern: printf($FMT, ...)
          - pattern: std::printf($FMT, ...)
          - pattern: vprintf($FMT, ...)
          - pattern: fprintf($F, $FMT, ...)
          - pattern: std::fprintf($F, $FMT, ...)
          - pattern: vfprintf($F, $FMT, ...)
          - pattern: dprintf($F, $FMT, ...)
          - pattern: sprintf($B, $FMT, ...)
          - pattern: std::sprintf($B, $FMT, ...)
          - pattern: vsprintf($B, $FMT, ...)
          - pattern: snprintf($B, $N, $FMT, ...)
          - pattern: std::snprintf($B, $N, $FMT, ...)
          - pattern: vsnprintf($B, $N, $FMT, ...)
          - pattern: syslog($P, $FMT, ...)
      - metavariable-regex:
          metavariable: $FMT
          # ignore string literals, i18n wrappers, PRI* / ALL_CAPS format macros
          regex: '^(?!\s*((L|u8|u|U)?"|_\(|N_\(|gettext\(|[A-Z_][A-Z0-9_]*\s*$|PRI))'
  # ---------------------------------------------------------------------------
  # 4b. Format string: untrusted data reaches the format argument (taint)
  # ---------------------------------------------------------------------------
  - id: c-format-string-tainted
    mode: taint
    languages: [c, cpp]
    severity: ERROR
    message: >-
      Untrusted data is used as a format string (printf-family, syslog).
      Always use a constant format and pass untrusted data as an argument: printf("%s", data).
    metadata:
      category: memory
      cwe: ["CWE-134: Use of Externally-Controlled Format String"]
      checklist: "H. Memory safety and language-specific weaknesses"
      checklist_ids: [MEM-07, INJ-01]
      confidence: HIGH
      technology: [c, cpp]
    paths:
      exclude:
        - "**/contrib/**"
        - "**/tests/**"
        - "**/benchmarks/**"
        - "**/gtest_*"
        - "**/build/**"
        - "**/build_*/**"
    options:
      taint_assume_safe_booleans: true
      taint_assume_safe_comparisons: true
    pattern-sources:
      - pattern-either:
          - pattern: recv(...)
          - pattern: recvfrom(...)
          - pattern: $REQ.getURI()
          - pattern: $REQ.getHost()
          - pattern: $REQ.get(...)
          - pattern: $FORM.get(...)
          - pattern: $CFG.getString(...)
          - pattern: $CFG.getRawString(...)
          - pattern: getenv(...)
          - pattern: std::getenv(...)
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: recv($FD, $OUT, ...)
              - pattern: recvfrom($FD, $OUT, ...)
              - pattern: read($FD, $OUT, ...)
              - pattern: $IN.read($OUT, ...)
              - pattern: $IN.readStrict($OUT, ...)
              - pattern: $SOCK.receiveBytes($OUT, ...)
              - patterns:
                  - pattern: $F($OUT, ...)
                  - metavariable-regex:
                      metavariable: $F
                      regex: '^(DB::)?(readStringBinary|readBinary|readEscapedString|readQuotedString|readCSVString|readDoubleQuotedString|deserialize\w*)$'
          - focus-metavariable: $OUT
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: printf($FMT, ...)
              - pattern: std::printf($FMT, ...)
              - pattern: vprintf($FMT, ...)
