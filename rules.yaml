rules:
  - id: python-sqli-dynamic-query
    languages: [python]
    severity: ERROR
    message: "Dynamic SQL query construction may allow SQL injection. Use parameterized queries."
    metadata:
      category: injection
      checklist: "1. Injection"
    patterns:
      - pattern-either:
          - pattern: '$CURSOR.execute(f"...")'
          - pattern: '$CURSOR.execute("..." % $X)'
          - pattern: '$CURSOR.execute("...".format(...))'
          - pattern: '$CURSOR.execute("..." + $X)'
          - pattern: '$CURSOR.execute($QUERY % $X)'
          - pattern: '$CURSOR.execute($QUERY.format(...))'
          - pattern: '$CURSOR.execute($QUERY + $X)'
          - pattern: '$DB.raw(...)'
          - pattern: '$QS.extra(...)'
          - pattern: 'text(f"...")'
          - pattern: 'text("..." % $X)'
          - pattern: 'text("...".format(...))'
          - pattern: 'text("..." + $X)'
          - pattern: 'RawSQL(...)'
      - pattern-not: '$CURSOR.execute("...")'

  - id: python-nosqli-mongo-operators
    languages: [python]
    severity: WARNING
    message: "MongoDB operator usage with dynamic input can lead to NoSQL injection."
    metadata:
      category: injection
      checklist: "1. Injection"
    pattern-either:
      - pattern: '$COLL.find({..., "$ne": ...})'
      - pattern: '$COLL.find({..., "$gt": ...})'
      - pattern: '$COLL.find({..., "$lt": ...})'
      - pattern: '$COLL.find({..., "$regex": ...})'
      - pattern: '$COLL.find({..., "$where": ...})'
      - pattern: '$COLL.find_one({..., "$ne": ...})'
      - pattern: '$COLL.find_one({..., "$gt": ...})'
      - pattern: '$COLL.find_one({..., "$lt": ...})'
      - pattern: '$COLL.find_one({..., "$regex": ...})'
      - pattern: '$COLL.find_one({..., "$where": ...})'
      - pattern: '$COLL.update_one({..., "$ne": ...}, ...)'
      - pattern: '$COLL.update_many({..., "$ne": ...}, ...)'
      - pattern: '$COLL.delete_one({..., "$ne": ...})'
      - pattern: '$COLL.delete_many({..., "$ne": ...})'

  - id: python-command-injection
    languages: [python]
    severity: ERROR
    message: "Shell or process execution may allow OS command injection."
    metadata:
      category: injection
      checklist: "1. Injection"
    patterns:
      - pattern-either:
          - pattern: os.system(...)
          - pattern: os.popen(...)
          - pattern: subprocess.call(..., shell=True, ...)
          - pattern: subprocess.run(..., shell=True, ...)
          - pattern: subprocess.Popen(..., shell=True, ...)
          - pattern: subprocess.check_call(..., shell=True, ...)
          - pattern: subprocess.check_output(..., shell=True, ...)
      - pattern-not: 'os.system("...")'
      - pattern-not: 'os.popen("...")'

  - id: python-code-eval
    languages: [python]
    severity: ERROR
    message: "Dynamic code execution can lead to remote code execution."
    metadata:
      category: injection
      checklist: "1. Injection"
    pattern-either:
      - pattern: eval(...)
      - pattern: exec(...)
      - pattern: compile(...)
      - pattern: __import__(...)

  - id: python-ssti
    languages: [python]
    severity: ERROR
    message: "Server-side template rendering with dynamic input can lead to SSTI."
    metadata:
      category: injection
      checklist: "1. Injection"
    patterns:
      - pattern-either:
          - pattern: render_template_string(...)
          - pattern: jinja2.Template(...)
          - pattern: jinja2.Environment(...).from_string(...)
          - pattern: Template(...)
      - pattern-not: 'render_template_string("...")'
      - pattern-not: 'Template("...")'

  - id: python-open-redirect
    languages: [python]
    severity: WARNING
    message: "Redirect target comes from request input; validate against an allowlist."
    metadata:
      category: web
      checklist: "2. Client-Side & Web Flaws"
    pattern-either:
      - pattern: redirect(request.args.get(...))
      - pattern: redirect(request.args[...])
      - pattern: redirect(request.form.get(...))
      - pattern: redirect(request.form[...])
      - pattern: redirect(request.values.get(...))
      - pattern: redirect(request.values[...])

  - id: python-csrf-exempt
    languages: [python]
    severity: WARNING
    message: "CSRF exemption may weaken CSRF protection."
    metadata:
      category: web
      checklist: "2. Client-Side & Web Flaws"
    pattern: csrf_exempt(...)

  - id: python-ssrf-sinks
    languages: [python]
    severity: WARNING
    message: "Outbound HTTP request sink can be abused for SSRF if URL is user-controlled."
    metadata:
      category: ssrf
      checklist: "3. Server-Side Request & Parser Flaws"
    pattern-either:
      - pattern: requests.get(...)
      - pattern: requests.post(...)
      - pattern: requests.put(...)
      - pattern: requests.delete(...)
      - pattern: requests.head(...)
      - pattern: requests.patch(...)
      - pattern: requests.request(...)
      - pattern: urllib.request.urlopen(...)
      - pattern: httpx.get(...)
      - pattern: httpx.post(...)
      - pattern: httpx.AsyncClient(...).get(...)
      - pattern: httpx.AsyncClient(...).post(...)

  - id: python-xxe-parser-usage
    languages: [python]
    severity: INFO
    message: "XML parsing can be vulnerable to XXE if external entity processing is enabled."
    metadata:
      category: parser
      checklist: "3. Server-Side Request & Parser Flaws"
    pattern-either:
      - pattern: lxml.etree.parse(...)
      - pattern: lxml.etree.fromstring(...)
      - pattern: xml.etree.ElementTree.parse(...)
      - pattern: xml.etree.ElementTree.fromstring(...)
      - pattern: xml.dom.expatbuilder.parse(...)

  - id: python-insecure-deserialization
    languages: [python]
    severity: ERROR
    message: "Insecure deserialization can lead to remote code execution."
    metadata:
      category: deserialization
      checklist: "3. Server-Side Request & Parser Flaws"
    pattern-either:
      - pattern: pickle.load(...)
      - pattern: pickle.loads(...)
      - pattern: cPickle.load(...)
      - pattern: cPickle.loads(...)
      - pattern: marshal.load(...)
      - pattern: marshal.loads(...)
      - pattern: yaml.load(...)
      - pattern: yaml.unsafe_load(...)
      - pattern: jsonpickle.decode(...)

  - id: python-archive-extraction
    languages: [python]
    severity: WARNING
    message: "Archive extraction without path or size checks can lead to zip-slip or decompression bombs."
    metadata:
      category: file
      checklist: "3. Server-Side Request & Parser Flaws"
    pattern-either:
      - pattern: '$TAR.extractall(...)'
      - pattern: '$ZIP.extractall(...)'
      - pattern: shutil.unpack_archive(...)

  - id: python-path-traversal-with-request-input
    languages: [python]
    severity: ERROR
    message: "File operation uses request input; enforce canonical path containment."
    metadata:
      category: file
      checklist: "4. File Handling"
    patterns:
      - pattern-either:
          - pattern: open(...)
          - pattern: send_file(...)
          - pattern: send_from_directory(...)
          - pattern: os.path.join(...)
      - pattern-either:
          - pattern: request.args.get(...)
          - pattern: request.args[...]
          - pattern: request.form.get(...)
          - pattern: request.form[...]
          - pattern: request.values.get(...)
          - pattern: request.values[...]
          - pattern: request.json
          - pattern: request.get_json(...)
          - pattern: request.data
          - pattern: request.files

  - id: python-tempfile-race
    languages: [python]
    severity: WARNING
    message: "tempfile.mktemp is unsafe due to race conditions; use mkstemp or NamedTemporaryFile."
    metadata:
      category: file
      checklist: "4. File Handling"
    pattern: tempfile.mktemp(...)

  - id: python-mass-assignment
    languages: [python]
    severity: WARNING
    message: "Object construction or update from request data may allow mass assignment."
    metadata:
      category: authorization
      checklist: "6. Authorization"
    pattern-either:
      - pattern: '$MODEL(**request.json)'
      - pattern: '$OBJ.update(request.json)'
      - pattern: '$OBJ.update(**request.json)'
      - pattern: '$OBJ.__dict__.update(request.json)'
      - pattern: 'setattr($OBJ, $FIELD, request.json.get(...))'

  - id: python-weak-password-hash
    languages: [python]
    severity: WARNING
    message: "Weak hash algorithm for credential storage; use bcrypt, scrypt, or Argon2."
    metadata:
      category: auth
      checklist: "5. Authentication"
    pattern-either:
      - pattern: hashlib.md5(...)
      - pattern: hashlib.sha1(...)
      - pattern: hashlib.sha256(...)

  - id: python-jwt-verification-disabled
    languages: [python]
    severity: ERROR
    message: "JWT signature verification is disabled."
    metadata:
      category: auth
      checklist: "5. Authentication"
    pattern-either:
      - pattern: 'jwt.decode(..., options={..., "verify_signature": False, ...})'
      - pattern: 'jwt.decode(..., verify=False, ...)'

  - id: python-tls-disabled
    languages: [python]
    severity: ERROR
    message: "TLS certificate verification is disabled."
    metadata:
      category: crypto
      checklist: "8. Cryptography"
    pattern-either:
      - pattern: requests.get(..., verify=False, ...)
      - pattern: requests.post(..., verify=False, ...)
      - pattern: requests.put(..., verify=False, ...)
      - pattern: requests.delete(..., verify=False, ...)
      - pattern: httpx.Client(..., verify=False, ...)
      - pattern: httpx.AsyncClient(..., verify=False, ...)
      - pattern: ssl._create_unverified_context(...)

  - id: python-crypto-ecb
    languages: [python]
    severity: ERROR
    message: "ECB mode is insecure; use authenticated encryption such as AES-GCM or ChaCha20-Poly1305."
    metadata:
      category: crypto
      checklist: "8. Cryptography"
    pattern-either:
      - pattern: AES.new(..., AES.MODE_ECB, ...)
      - pattern: Cipher(algorithms.AES(...), modes.ECB(...), ...)

  - id: python-insecure-random
    languages: [python]
    severity: INFO
    message: "random module is not cryptographically secure; use secrets for tokens or keys."
    metadata:
      category: crypto
      checklist: "8. Cryptography"
    pattern-either:
      - pattern: random.random(...)
      - pattern: random.randint(...)
      - pattern: random.randrange(...)
      - pattern: random.choice(...)
      - pattern: random.shuffle(...)

  - id: python-debug-enabled
    languages: [python]
    severity: WARNING
    message: "Debug mode is enabled."
    metadata:
      category: config
      checklist: "9. Secrets & Configuration"
    pattern-either:
      - pattern: app.run(..., debug=True, ...)
      - pattern: DEBUG = True

  - id: js-code-injection
    languages: [javascript, typescript]
    severity: ERROR
    message: "Dynamic code execution or shell execution may allow code injection."
    metadata:
      category: injection
      checklist: "1. Injection"
    pattern-either:
      - pattern: eval(...)
      - pattern: new Function(...)
      - pattern: 'setTimeout("...")'
      - pattern: 'setInterval("...")'
      - pattern: vm.runInContext(...)
      - pattern: vm.runInNewContext(...)
      - pattern: child_process.exec(...)
      - pattern: child_process.execSync(...)
      - pattern: $CP.exec(...)
      - pattern: $CP.execSync(...)

  - id: js-xss-sinks
    languages: [javascript, typescript]
    severity: ERROR
    message: "HTML injection sink may allow XSS."
    metadata:
      category: web
      checklist: "2. Client-Side & Web Flaws"
    pattern-either:
      - pattern: '$EL.innerHTML = ...'
      - pattern: '$EL.outerHTML = ...'
      - pattern: document.write(...)
      - pattern: document.writeln(...)
      - pattern: '$EL.insertAdjacentHTML(...)'
      - pattern: '$X.dangerouslySetInnerHTML = ...'
      - pattern: '<$TAG dangerouslySetInnerHTML={...} />'

  - id: js-open-redirect
    languages: [javascript, typescript]
    severity: WARNING
    message: "Redirect target comes from request input; validate against an allowlist."
    metadata:
      category: web
      checklist: "2. Client-Side & Web Flaws"
    pattern-either:
      - pattern: window.location = $REQ.query.$X
      - pattern: window.location.href = $REQ.query.$X
      - pattern: window.location.assign($REQ.query.$X)
      - pattern: window.location.replace($REQ.query.$X)
      - pattern: $RES.redirect($REQ.query.$X)

  - id: js-ssrf-sinks
    languages: [javascript, typescript]
    severity: WARNING
    message: "Outbound HTTP sink can be abused for SSRF if URL is user-controlled."
    metadata:
      category: ssrf
      checklist: "3. Server-Side Request & Parser Flaws"
    pattern-either:
      - pattern: fetch(...)
      - pattern: axios.get(...)
      - pattern: axios.post(...)
      - pattern: axios.put(...)
      - pattern: axios.delete(...)
      - pattern: $HTTP.get(...)
      - pattern: $HTTP.post(...)

  - id: js-prototype-pollution
    languages: [javascript, typescript]
    severity: ERROR
    message: "Direct modification of prototype properties may allow prototype pollution."
    metadata:
      category: web
      checklist: "2. Client-Side & Web Flaws"
    pattern-either:
      - pattern: '$OBJ.__proto__ = ...'
      - pattern: '$OBJ["__proto__"] = ...'
      - pattern: "$OBJ['__proto__'] = ..."
      - pattern: '$OBJ.constructor.prototype = ...'

  - id: js-node-tls-disabled
    languages: [javascript, typescript]
    severity: ERROR
    message: "TLS certificate validation is disabled."
    metadata:
      category: crypto
      checklist: "8. Cryptography"
    pattern-regex: 'rejectUnauthorized\s*:\s*false'

  - id: js-insecure-random
    languages: [javascript, typescript]
    severity: INFO
    message: "Math.random is not cryptographically secure; use crypto.getRandomValues or crypto.randomBytes."
    metadata:
      category: crypto
      checklist: "8. Cryptography"
    pattern: Math.random(...)

  - id: java-sqli-dynamic-query
    languages: [java]
    severity: ERROR
    message: "Dynamic SQL query construction may allow SQL injection. Use prepared statements."
    metadata:
      category: injection
      checklist: "1. Injection"
    pattern-either:
      - pattern: '$STMT.executeQuery($SQL + ...)'
      - pattern: '$STMT.execute($SQL + ...)'
      - pattern: '$STMT.executeUpdate($SQL + ...)'
      - pattern: '$CONN.prepareStatement($SQL + ...)'
      - pattern: '$CONN.createStatement(...).executeQuery($SQL + ...)'

  - id: java-command-injection
    languages: [java]
    severity: ERROR
    message: "Process execution may allow OS command injection."
    metadata:
      category: injection
      checklist: "1. Injection"
    pattern-either:
      - pattern: Runtime.getRuntime().exec(...)
      - pattern: new ProcessBuilder(...).start()

  - id: java-expression-injection
    languages: [java]
    severity: ERROR
    message: "Expression language parsing may allow expression injection."
    metadata:
      category: injection
      checklist: "1. Injection"
    pattern-either:
      - pattern: '$PARSER.parseExpression(...)'
      - pattern: Ognl.getValue(...)

  - id: java-xxe-parser-construction
    languages: [java]
    severity: INFO
    message: "XML parser construction can be vulnerable to XXE if external entities are not disabled."
    metadata:
      category: parser
      checklist: "3. Server-Side Request & Parser Flaws"
    pattern-either:
      - pattern: DocumentBuilderFactory.newInstance()
      - pattern: SAXParserFactory.newInstance()
      - pattern: XMLInputFactory.newInstance()
      - pattern: TransformerFactory.newInstance()

  - id: java-insecure-deserialization
    languages: [java]
    severity: ERROR
    message: "Java deserialization can lead to remote code execution."
    metadata:
      category: deserialization
      checklist: "3. Server-Side Request & Parser Flaws"
    pattern-either:
      - pattern: new ObjectInputStream(...).readObject()
      - pattern: '$OIS.readObject()'

  - id: php-injection-sinks
    languages: [php]
    severity: ERROR
    message: "Command execution, code evaluation, or deserialization sink detected."
    metadata:
      category: injection
      checklist: "1. Injection"
    pattern-either:
      - pattern: system(...)
      - pattern: exec(...)
      - pattern: passthru(...)
      - pattern: shell_exec(...)
      - pattern: popen(...)
      - pattern: proc_open(...)
      - pattern: eval(...)
      - pattern: unserialize(...)

  - id: php-sqli-dynamic-query
    languages: [php]
    severity: ERROR
    message: "Dynamic SQL query construction may allow SQL injection. Use prepared statements."
    metadata:
      category: injection
      checklist: "1. Injection"
    pattern-either:
      - pattern: mysqli_query($CONN, $SQL . ...)
      - pattern: '$CONN->query($SQL . ...)'
      - pattern: '$PDO->query($SQL . ...)'

  - id: go-command-injection
    languages: [go]
    severity: ERROR
    message: "Shell execution may allow OS command injection."
    metadata:
      category: injection
      checklist: "1. Injection"
    pattern-either:
      - pattern: 'exec.Command("sh", "-c", ...)'
      - pattern: 'exec.Command("/bin/sh", "-c", ...)'
      - pattern: 'exec.CommandContext($CTX, "sh", "-c", ...)'
      - pattern: 'exec.CommandContext($CTX, "/bin/sh", "-c", ...)'

  - id: go-tls-disabled
    languages: [go]
    severity: ERROR
    message: "TLS certificate verification is disabled."
    metadata:
      category: crypto
      checklist: "8. Cryptography"
    pattern: 'InsecureSkipVerify: true'

  - id: c-memory-unsafe-functions
    languages: [c, cpp]
    severity: WARNING
    message: "Unsafe memory or string function may cause memory corruption."
    metadata:
      category: memory
      checklist: "11. Memory Safety"
    pattern-either:
      - pattern: strcpy(...)
      - pattern: sprintf(...)
      - pattern: gets(...)
      - pattern: 'scanf("%s", ...)'
      - pattern: memcpy(...)

  - id: c-format-string
    languages: [c, cpp]
    severity: ERROR
    message: "Non-constant format string may allow format string exploitation."
    metadata:
      category: memory
      checklist: "11. Memory Safety"
    patterns:
      - pattern-either:
          - pattern: printf($X)
          - pattern: fprintf($F, $X)
      - pattern-not: 'printf("...")'
      - pattern-not: 'fprintf($F, "...")'

  - id: secrets-known-key-patterns
    languages: [generic]
    severity: ERROR
    message: "Potential hardcoded secret detected."
    metadata:
      category: secrets
      checklist: "9. Secrets & Configuration"
    pattern-either:
      - pattern-regex: 'AKIA[0-9A-Z]{16}'
      - pattern-regex: 'ASIA[0-9A-Z]{16}'
      - pattern-regex: 'gh[pousr]_[A-Za-z0-9]{36,}'
      - pattern-regex: 'github_pat_[0-9A-Za-z_]{22,}'
      - pattern-regex: 'sk_live_[0-9a-zA-Z]{24,}'
      - pattern-regex: 'xox[baprs]-[0-9A-Za-z-]{10,}'
      - pattern-regex: '-----BEGIN [A-Z ]*PRIVATE KEY-----'
      - pattern-regex: '(postgres|postgresql|mysql|mongodb|mongodb\+srv|redis|amqp|jdbc:[a-z0-9]+)://[^:/\s]+:[^@\s]+@'
      - pattern-regex: '[MNT][A-Za-z0-9]{23,}\.[A-Za-z0-9_-]{6}\.[A-Za-z0-9_-]{27,}'

  - id: iac-dockerfile-root-user
    languages: [generic]
    severity: WARNING
    message: "Container runs as root."
    metadata:
      category: iac
      checklist: "10. Infrastructure-as-Code & CI/CD"
    paths:
      include:
        - "*Dockerfile*"
        - "*.dockerfile"
    pattern-regex: '^\s*USER\s+root'

  - id: iac-dockerfile-curl-pipe-shell
    languages: [generic]
    severity: ERROR
    message: "Remote script is piped into a shell."
    metadata:
      category: iac
      checklist: "10. Infrastructure-as-Code & CI/CD"
    paths:
      include:
        - "*Dockerfile*"
        - "*.dockerfile"
    pattern-regex: 'curl\s+[^\n]*\|\s*(ba|z)?sh'

  - id: iac-k8s-privileged-container
    languages: [generic]
    severity: ERROR
    message: "Privileged container detected."
    metadata:
      category: iac
      checklist: "10. Infrastructure-as-Code & CI/CD"
    paths:
      include:
        - "*.yaml"
        - "*.yml"
    pattern-regex: 'privileged:\s*true'

  - id: iac-terraform-open-cidr
    languages: [generic]
    severity: ERROR
    message: "Security group or ingress allows 0.0.0.0/0."
    metadata:
      category: iac
      checklist: "10. Infrastructure-as-Code & CI/CD"
    paths:
      include:
        - "*.tf"
    pattern-regex: 'cidr_blocks\s*=\s*\[\s*"0\.0\.0\.0/0"\s*\]'

  - id: iac-terraform-public-s3-acl
    languages: [generic]
    severity: ERROR
    message: "S3 bucket ACL appears public."
    metadata:
      category: iac
      checklist: "10. Infrastructure-as-Code & CI/CD"
    paths:
      include:
        - "*.tf"
    pattern-regex: 'acl\s*=\s*"public-read"'

  - id: iac-github-actions-event-injection
    languages: [generic]
    severity: WARNING
    message: "GitHub Actions expression uses github.event data; possible script injection."
    metadata:
      category: cicd
      checklist: "10. Infrastructure-as-Code & CI/CD"
    paths:
      include:
        - ".github/workflows/*.yml"
        - ".github/workflows/*.yaml"
    pattern-regex: '\$\{\{\s*github\.event\.'