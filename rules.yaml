    patterns:
      - pattern: $F(...)
      - metavariable-regex:
          metavariable: $F
          regex: '^(::)?(EVP_md5|EVP_md4|EVP_md2|EVP_sha1|MD5|MD5_Init|MD4|MD4_Init|SHA1|SHA1_Init|CC_MD5|CC_SHA1)$'
  - id: c-hardcoded-crypto-key-or-iv
    languages: [c, cpp]
    severity: ERROR
    message: >-
      Literal key or IV passed to a cryptographic primitive. Keys must come from a secret store and
      IVs/nonces must be random or unique per message; never constants in source.
    metadata:
