  # ---------------------------------------------------------------------------
  # 6. Off-by-one: '<=' (or '>' guard) used where '<' (or '>=') is required
  # ---------------------------------------------------------------------------
  - id: c-off-by-one-bounds
    languages: [c, cpp]
    severity: ERROR
    message: >-
      Probable off-by-one: the index '$I' can equal the element count/size of '$BUF', so
      '$BUF[$I]' reads or writes one element past the end. Use '<' (or '>=' in the rejecting guard).
    metadata:
      category: memory
      cwe: ["CWE-193: Off-by-one Error", "CWE-787: Out-of-bounds Write", "CWE-125: Out-of-bounds Read"]
      checklist: "H. Memory safety and language-specific weaknesses"
      checklist_ids: [MEM-01]
      confidence: MEDIUM
      technology: [c, cpp]
    paths:
      exclude:
        - "**/contrib/**"
        - "**/tests/**"
        - "**/benchmarks/**"
        - "**/gtest_*"
        - "**/build/**"
        - "**/build_*/**"
    patterns:
      - pattern-either:
          # for/while (i <= buf.size()) { buf[i] }
          - patterns:
              - pattern-inside: |
                  for (...; $I <= $BUF.size(); ...) $S;
              - pattern: $BUF[$I]
          - patterns:
              - pattern-inside: |
                  for (...; $I <= $BUF.length(); ...) $S;
              - pattern: $BUF[$I]
          - patterns:
              - pattern-inside: |
                  while (<... $I <= $BUF.size() ...>) $S;
              - pattern: $BUF[$I]
          # for (i <= sizeof(buf)) / sizeof(buf)/sizeof(buf[0]) / std::size(buf)
          - patterns:
              - pattern-inside: |
                  for (...; $I <= sizeof($BUF); ...) $S;
              - pattern: $BUF[$I]
          - patterns:
              - pattern-inside: |
                  for (...; $I <= sizeof($BUF) / sizeof($BUF[0]); ...) $S;
              - pattern: $BUF[$I]
          - patterns:
              - pattern-inside: |
                  for (...; $I <= std::size($BUF); ...) $S;
              - pattern: $BUF[$I]
          # T buf[N]; ... for (i <= N) { buf[i] }
          - patterns:
              - pattern-inside: |
                  $T $BUF[$N];
                  ...
              - pattern-inside: |
                  for (...; $I <= $N; ...) $S;
              - pattern: $BUF[$I]
          - patterns:
              - pattern-inside: |
                  $T $BUF[$N];
                  ...
              - pattern-inside: |
                  while (<... $I <= $N ...>) $S;
              - pattern: $BUF[$I]
          # T buf[N]; ... if (i <= N) { buf[i] }
          - patterns:
              - pattern-inside: |
                  $T $BUF[$N];
                  ...
              - pattern-inside: |
                  if (<... $I <= $N ...>) { ... }
              - pattern: $BUF[$I]
          # v.size(): if (i <= v.size()) { v[i] }
          - patterns:
              - pattern-inside: |
                  if (<... $I <= $BUF.size() ...>) { ... }
              - pattern: $BUF[$I]
          # reject-guard written with '>' instead of '>='
          - patterns:
              - pattern-inside: |
                  if (<... $I > $BUF.size() ...>) { ...; throw ...; }
                  ...
              - pattern: $BUF[$I]
          - patterns:
              - pattern-inside: |
                  if (<... $I > $BUF.size() ...>) { ...; return ...; }
                  ...
              - pattern: $BUF[$I]
          - patterns:
              - pattern-inside: |
                  $T $BUF[$N];
                  ...
              - pattern-inside: |
                  if (<... $I > $N ...>) { ...; throw ...; }
                  ...
              - pattern: $BUF[$I]
          - patterns:
              - pattern-inside: |
                  $T $BUF[$N];
                  ...
              - pattern-inside: |
                  if (<... $I > $N ...>) { ...; return ...; }
                  ...
              - pattern: $BUF[$I]
          - patterns:
              - pattern-inside: |
                  if (<... $I > $BUF.size() ...>) throw ...;
                  ...
              - pattern: $BUF[$I]
          - patterns:
              - pattern-inside: |
                  if (<... $I > $BUF.size() ...>) return ...;
                  ...
              - pattern: $BUF[$I]
          - patterns:
              - pattern-inside: |
                  $T $BUF[$N];
                  ...
              - pattern-inside: |
                  if (<... $I > $N ...>) throw ...;
                  ...
              - pattern: $BUF[$I]
          - patterns:
              - pattern-inside: |
                  $T $BUF[$N];
                  ...
              - pattern-inside: |
                  if (<... $I > $N ...>) return ...;
                  ...
              - pattern: $BUF[$I]
          # direct write/read one-past-the-end: char buf[N]; buf[N] = ...
          - patterns:
              - pattern-inside: |
                  $T $BUF[$N];
                  ...
              - pattern: $BUF[$N]
          - patterns:
              - pattern-inside: |
                  $T $BUF[$N];
                  ...
              - pattern: $BUF[sizeof($BUF)]
