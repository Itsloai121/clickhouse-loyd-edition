      OS command injection. Avoid the shell: use execv/posix_spawn with an argument vector and an
      absolute program path.
    metadata:
      category: injection
      cwe: ["CWE-78: OS Command Injection"]
      checklist: "B. Input validation and injection"
      checklist_ids: [INJ-03, OS-04]
      confidence: MEDIUM
