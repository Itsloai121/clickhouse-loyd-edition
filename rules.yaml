        - "**/build/**"
        - "**/build_*/**"
    patterns:
      - pattern-either:
          - pattern: srand(time(...))
          - patterns:
              - pattern-either:
                  - pattern: $V = <... rand() ...>;
                  - pattern: $V = <... std::rand() ...>;
                  - pattern: $V = <... random() ...>;
                  - pattern: $V = <... drand48() ...>;
                  - pattern: $T $V = <... rand() ...>;
                  - pattern: $T $V = <... std::rand() ...>;
                  - pattern: $T $V = <... random() ...>;
              - metavariable-regex:
                  metavariable: $V
                  regex: '(?i)(token|nonce|salt|secret|passw|session|csrf|otp|(^|_)iv$|(api|secret|private|enc|session|crypto)_?key)'
  - id: c-non-constant-time-secret-compare
    languages: [c, cpp]
    severity: WARNING
    message: >-
      Secret-like value compared with memcmp/strcmp, which returns early and leaks timing.
      Use a constant-time comparison (CRYPTO_memcmp, sodium_memcmp, or an equivalent loop).
    metadata:
      category: crypto
      cwe: ["CWE-208: Observable Timing Discrepancy", "CWE-1254: Incorrect Comparison Logic Granularity"]
      checklist: "E. Cryptography and sensitive information"
      checklist_ids: [CRY-01, AUTH-01, AUTH-03]
      confidence: MEDIUM
      technology: [c, cpp]
    paths:
      exclude:
        - "**/contrib/**"
        - "**/tests/**"
        - "**/benchmarks/**"
        - "**/gtest_*"
        - "**/build/**"
        - "**/build_*/**"
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: memcmp($A, $B, ...)
                  - pattern: std::memcmp($A, $B, ...)
                  - pattern: strcmp($A, $B)
                  - pattern: strncmp($A, $B, ...)
              - metavariable-regex:
                  metavariable: $A
                  regex: '(?i)(hmac|signature|token|secret|passw|api_?key|credential|digest)'
          - patterns:
              - pattern-either:
                  - pattern: memcmp($A, $B, ...)
                  - pattern: std::memcmp($A, $B, ...)
                  - pattern: strcmp($A, $B)
                  - pattern: strncmp($A, $B, ...)
              - metavariable-regex:
                  metavariable: $B
                  regex: '(?i)(hmac|signature|token|secret|passw|api_?key|credential|digest)'
  - id: c-sensitive-data-in-log
    languages: [c, cpp]
    severity: WARNING
    message: >-
      Password/secret/key-like value passed to a logging call. Redact or omit credentials,
      tokens and key material from logs, telemetry and crash reports.
    metadata:
      category: logging
      cwe: ["CWE-532: Insertion of Sensitive Information into Log File"]
      checklist: "M. Error handling, logging, and monitoring"
      checklist_ids: [LOG-03, CRY-10, PRV-07]
