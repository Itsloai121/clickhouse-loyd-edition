          regex: '(?i)^(.*[_.>:-])?(password|passwd|pwd|secret|secret_?key|api_?key|private_?key|access_?key|auth_?token|token)$'
      - metavariable-regex:
          metavariable: $S
          regex: '^"[^"\s{}%]{6,}"$'
  - id: c-tls-verification-disabled
    languages: [c, cpp]
    severity: ERROR
    message: >-
      TLS peer/hostname verification is disabled, enabling man-in-the-middle attacks. Keep
      verification on (SSL_VERIFY_PEER, hostname check) and make any opt-out an explicit,
      logged, non-default administrator decision.
